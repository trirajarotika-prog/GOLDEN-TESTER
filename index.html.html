    // ============================================================
    // APPROVAL PAGE - pending edit requests
    // ============================================================
    function ApprovalPage({ currentUser, onNavigate, data, setData, showToast }) {
      const pendingRequests = (data.editRequests || []).filter(r => r.status === 'pending');
      const [selectedRequest, setSelectedRequest] = React.useState(null);

      function handleApprove(req) {
        const originalReport = data.reports.find(r => r.id === req.reportId);
        if (!originalReport) {
          showToast('Laporan asli tidak ditemukan', 'error');
          return;
        }
        const updated = {
          ...originalReport,
          ...req.proposedData,
          lastEditedAt: new Date().toISOString(),
          lastEditedBy: req.requesterName + ' (via approval)',
          approvedBy: currentUser.name,
          approvedAt: new Date().toISOString(),
        };
        const newData = {
          ...data,
          reports: data.reports.map(r => r.id === req.reportId ? updated : r),
          editRequests: data.editRequests.map(r => r.id === req.id ? { ...r, status: 'approved', resolvedBy: currentUser.name, resolvedAt: new Date().toISOString() } : r),
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'approve_edit',
            target: `Laporan ${formatDate(req.proposedData.date)} Shift ${req.proposedData.shift}`,
            details: `Pengajuan dari ${req.requesterName}`
          }]
        };
        setData(newData);
        setSelectedRequest(null);
        showToast('Pengajuan edit disetujui', 'success');
      }

      function handleReject(req) {
        const newData = {
          ...data,
          editRequests: data.editRequests.map(r => r.id === req.id ? { ...r, status: 'rejected', resolvedBy: currentUser.name, resolvedAt: new Date().toISOString() } : r),
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'reject_edit',
            target: `Laporan ${formatDate(req.proposedData.date)} Shift ${req.proposedData.shift}`,
            details: `Pengajuan dari ${req.requesterName}`
          }]
        };
        setData(newData);
        setSelectedRequest(null);
        showToast('Pengajuan edit ditolak', 'info');
      }

      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream, paddingBottom: 80 }}>
          <PageHeader
            title="Approval Edit"
            subtitle={`${pendingRequests.length} pengajuan menunggu`}
            onBack={() => onNavigate('dashboard')}
            dark
          />

          <div style={{ padding: 14 }}>
            {pendingRequests.length === 0 ? (
              <EmptyState icon="checkCircle" title="Tidak ada pengajuan" message="Semua pengajuan edit sudah ditangani." />
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {pendingRequests.map(req => {
                  const proposedTotals = calcReportTotals(req.proposedData);
                  const originalTotals = calcReportTotals(req.originalSnapshot);
                  return (
                    <div key={req.id} className="gfl-card" style={{ padding: 14 }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 8 }}>
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.brown }}>
                            {formatDate(req.proposedData.date)} · Shift {req.proposedData.shift}
                          </div>
                          <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 2 }}>
                            Diajukan oleh {req.requesterName} · {timeAgo(req.createdAt)}
                          </div>
                        </div>
                        <Badge color={COLORS.warning}>Menunggu</Badge>
                      </div>

                      <div style={{
                        background: COLORS.creamLight, padding: 10, borderRadius: 10, marginBottom: 10,
                        fontSize: 11, color: COLORS.text, lineHeight: 1.5,
                        border: `1px solid ${COLORS.borderLight}`
                      }}>
                        <div style={{ fontWeight: 700, color: COLORS.brown, marginBottom: 4 }}>📝 Alasan:</div>
                        {req.reason}
                      </div>

                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 10 }}>
                        <div style={{
                          padding: 10, background: COLORS.dangerLight, borderRadius: 10, fontSize: 10
                        }}>
                          <div style={{ fontWeight: 700, color: COLORS.danger, marginBottom: 4 }}>SEBELUM</div>
                          <div>Batch: <strong>{originalTotals.totalBatch}</strong></div>
                          <div>Sak: <strong>{originalTotals.totalSak}</strong></div>
                          <div>Gas: <strong>{formatNumber(req.originalSnapshot.gas?.sm3 || 0, 1)} Sm³</strong></div>
                        </div>
                        <div style={{
                          padding: 10, background: COLORS.successLight, borderRadius: 10, fontSize: 10
                        }}>
                          <div style={{ fontWeight: 700, color: COLORS.success, marginBottom: 4 }}>SESUDAH</div>
                          <div>Batch: <strong>{proposedTotals.totalBatch}</strong></div>
                          <div>Sak: <strong>{proposedTotals.totalSak}</strong></div>
                          <div>Gas: <strong>{formatNumber(req.proposedData.gas?.sm3 || 0, 1)} Sm³</strong></div>
                        </div>
                      </div>

                      <div style={{ display: 'flex', gap: 6 }}>
                        <button onClick={() => setSelectedRequest(req)} className="gfl-btn gfl-btn-secondary" style={{ flex: 1, padding: '8px 12px', fontSize: 12 }}>
                          <Icon name="eye" size={12} /> Detail
                        </button>
                        <button onClick={() => handleReject(req)} style={{
                          padding: '8px 12px', borderRadius: 999, background: COLORS.dangerLight, color: COLORS.danger,
                          border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 700,
                          display: 'inline-flex', alignItems: 'center', gap: 4
                        }}>
                          <Icon name="x" size={12} color={COLORS.danger} /> Tolak
                        </button>
                        <button onClick={() => handleApprove(req)} className="gfl-btn gfl-btn-primary" style={{ flex: 1, padding: '8px 12px', fontSize: 12 }}>
                          <Icon name="check" size={12} color="#fff" /> Setujui
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {selectedRequest && (
            <Modal open={true} onClose={() => setSelectedRequest(null)} title="Detail Pengajuan Edit" maxWidth={400}>
              <div style={{
                padding: 12, background: COLORS.creamLight, borderRadius: 12, marginBottom: 14, fontSize: 12
              }}>
                <div style={{ marginBottom: 6 }}><strong>Laporan:</strong> {formatDate(selectedRequest.proposedData.date)} Shift {selectedRequest.proposedData.shift}</div>
                <div style={{ marginBottom: 6 }}><strong>Pengaju:</strong> {selectedRequest.requesterName}</div>
                <div style={{ marginBottom: 6 }}><strong>Waktu:</strong> {new Date(selectedRequest.createdAt).toLocaleString('id-ID')}</div>
                <div style={{ marginTop: 10, padding: 8, background: '#fff', borderRadius: 8, fontSize: 11 }}>
                  <strong>Alasan:</strong><br/>{selectedRequest.reason}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => handleReject(selectedRequest)} className="gfl-btn gfl-btn-danger" style={{ flex: 1 }}>
                  <Icon name="x" size={14} color="#fff" /> Tolak
                </button>
                <button onClick={() => handleApprove(selectedRequest)} className="gfl-btn gfl-btn-primary" style={{ flex: 1 }}>
                  <Icon name="check" size={14} color="#fff" /> Setujui
                </button>
              </div>
            </Modal>
          )}
        </div>
      );
    }
    // ============================================================
    // MUTASI LAPORAN - with tabs (Semua, Mixing, Drying, Gas, Tepung, Downtime)
    // ============================================================
    function MutasiLaporanPage({ currentUser, onNavigate, data, setData, showToast, initialTab }) {
      const [tab, setTab] = React.useState(initialTab || 'semua');
      const [filter, setFilter] = React.useState({ from: '', to: '', shift: '', leader: '' });
      const [showFilter, setShowFilter] = React.useState(false);

      const filtered = React.useMemo(() => {
        return data.reports.filter(r => {
          if (filter.from && r.date < filter.from) return false;
          if (filter.to && r.date > filter.to) return false;
          if (filter.shift && r.shift !== parseInt(filter.shift, 10)) return false;
          if (filter.leader && r.leaderId !== parseInt(filter.leader, 10)) return false;
          return true;
        }).sort((a, b) => new Date(a.date) - new Date(b.date) || a.shift - b.shift);
      }, [data.reports, filter]);

      const summary = React.useMemo(() => {
        let totalBatch = 0, totalSak = 0, totalGasSm3 = 0, totalBiaya = 0, totalDowntime = 0, totalTepung = 0, totalRagi = 0;
        filtered.forEach(r => {
          const t = calcReportTotals(r);
          totalBatch += t.totalBatch; totalSak += t.totalSak;
          totalDowntime += t.totalDowntime; totalTepung += t.totalTepung;
          totalGasSm3 += (r.gas?.sm3 || 0); totalBiaya += (r.gas?.biaya || 0);
          totalRagi += (r.ragi || 0);
        });
        return { totalBatch, totalSak, totalGasSm3, totalBiaya, totalDowntime, totalTepung, totalRagi, count: filtered.length };
      }, [filtered]);

      const leaders = data.users.filter(u => u.role === 'Team Leader' || u.role === 'Supervisor');

      function exportExcel() {
        if (typeof XLSX === 'undefined') { showToast('Loading library...', 'info'); return; }
        const wb = XLSX.utils.book_new();

        // Sheet 1: Ringkasan
        const summaryData = [
          ['LAPORAN MUTASI PRODUKSI'],
          ['CV Golden Food Lestari'],
          ['Periode:', `${filter.from || 'Awal'} s/d ${filter.to || 'Akhir'}`],
          [],
          ['Total Laporan', summary.count],
          ['Total Batch', summary.totalBatch],
          ['Total Sak', summary.totalSak],
          ['Total Tepung (sak)', summary.totalTepung],
          ['Total Ragi (kg)', summary.totalRagi],
          ['Total Konsumsi Gas (Sm³)', formatNumber(summary.totalGasSm3, 2)],
          ['Total Biaya Gas (Rp)', summary.totalBiaya],
          ['Total Downtime (menit)', summary.totalDowntime],
        ];
        const ws1 = XLSX.utils.aoa_to_sheet(summaryData);
        ws1['!cols'] = [{ wch: 30 }, { wch: 20 }];
        XLSX.utils.book_append_sheet(wb, ws1, 'Ringkasan');

        // Sheet 2: Rincian Mixing
        const mixingRows = [['Tanggal', 'Shift', 'Leader', 'Mesin', 'Produk', 'No. Planning', 'Batch']];
        filtered.forEach(r => {
          (r.mixing || []).forEach(m =>
            (m.products || []).forEach(prod =>
              (prod.plannings || []).forEach(pl => {
                mixingRows.push([formatDateShort(r.date), `Shift ${r.shift}`, r.leaderName, m.machineName, prod.productName, pl.noPlanning, pl.batches]);
              })
            )
          );
        });
        const ws2 = XLSX.utils.aoa_to_sheet(mixingRows);
        ws2['!cols'] = [{wch:12},{wch:8},{wch:20},{wch:14},{wch:24},{wch:14},{wch:8}];
        XLSX.utils.book_append_sheet(wb, ws2, 'Rincian Mixing');

        // Sheet 3: Rincian Drying
        const dryingRows = [['Tanggal', 'Shift', 'Leader', 'Mesin', 'Produk', 'No. Planning', 'Sak']];
        filtered.forEach(r => {
          (r.drying || []).forEach(d =>
            (d.products || []).forEach(prod =>
              (prod.plannings || []).forEach(pl => {
                dryingRows.push([formatDateShort(r.date), `Shift ${r.shift}`, r.leaderName, d.machineNo, prod.productName, pl.noPlanning, pl.sacks]);
              })
            )
          );
        });
        const ws3 = XLSX.utils.aoa_to_sheet(dryingRows);
        ws3['!cols'] = [{wch:12},{wch:8},{wch:20},{wch:8},{wch:24},{wch:14},{wch:8}];
        XLSX.utils.book_append_sheet(wb, ws3, 'Rincian Drying');

        // Sheet 4: Rincian Downtime (NEW)
        const downtimeRows = [['Tanggal', 'Shift', 'Leader', 'Mesin', 'Jam Mulai', 'Jam Selesai', 'Durasi (menit)', 'Kategori', 'Detail']];
        filtered.forEach(r => {
          (r.downtime || []).forEach(dt => {
            downtimeRows.push([
              formatDateShort(r.date), `Shift ${r.shift}`, r.leaderName,
              dt.machineName, dt.startTime, dt.endTime, dt.duration,
              dt.category, dt.detailReason || dt.detailMachine || ''
            ]);
          });
        });
        const ws4 = XLSX.utils.aoa_to_sheet(downtimeRows);
        ws4['!cols'] = [{wch:12},{wch:8},{wch:20},{wch:14},{wch:10},{wch:10},{wch:14},{wch:22},{wch:30}];
        XLSX.utils.book_append_sheet(wb, ws4, 'Rincian Downtime');

        // Sheet 5: Total per Leader
        const leaderMap = {};
        filtered.forEach(r => {
          if (!leaderMap[r.leaderName]) leaderMap[r.leaderName] = { batch: 0, sak: 0, gas: 0, biaya: 0, count: 0, downtime: 0 };
          const t = calcReportTotals(r);
          leaderMap[r.leaderName].batch += t.totalBatch;
          leaderMap[r.leaderName].sak += t.totalSak;
          leaderMap[r.leaderName].downtime += t.totalDowntime;
          leaderMap[r.leaderName].gas += (r.gas?.sm3 || 0);
          leaderMap[r.leaderName].biaya += (r.gas?.biaya || 0);
          leaderMap[r.leaderName].count++;
        });
        const leaderRows = [['Leader', 'Jml Laporan', 'Total Batch', 'Total Sak', 'Total Gas (Sm³)', 'Total Biaya (Rp)', 'Downtime (menit)']];
        Object.entries(leaderMap).forEach(([name, v]) => {
          leaderRows.push([name, v.count, v.batch, v.sak, Math.round(v.gas * 100) / 100, v.biaya, v.downtime]);
        });
        const ws5 = XLSX.utils.aoa_to_sheet(leaderRows);
        ws5['!cols'] = [{wch:24},{wch:12},{wch:12},{wch:12},{wch:14},{wch:16},{wch:14}];
        XLSX.utils.book_append_sheet(wb, ws5, 'Total per Leader');

        const filename = `Mutasi_Produksi_${filter.from || 'semua'}_${filter.to || 'semua'}.xlsx`;
        XLSX.writeFile(wb, filename);
        showToast('Excel berhasil diunduh (5 sheet)', 'success');
      }

      function printPDF() { window.print(); }

      const tabs = [
        { id: 'semua', label: 'Semua', icon: 'list' },
        { id: 'mixing', label: 'Mixing', icon: 'package' },
        { id: 'drying', label: 'Drying', icon: 'archive' },
        { id: 'gas', label: 'Gas', icon: 'flame' },
        { id: 'flour', label: 'Tepung', icon: 'package' },
        { id: 'downtime', label: 'Downtime', icon: 'clock' },
      ];

      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream, paddingBottom: 80 }}>
          <div className="no-print">
            <PageHeader
              title="Mutasi Laporan"
              subtitle={`${summary.count} laporan`}
              onBack={() => onNavigate('dashboard')}
              dark
              action={
                <button onClick={() => setShowFilter(!showFilter)} style={{
                  background: showFilter ? COLORS.gold : 'rgba(255,255,255,0.15)',
                  border: 'none', borderRadius: 12, padding: 10, cursor: 'pointer'
                }}>
                  <Icon name="filter" size={16} color="#fff" />
                </button>
              }
            />
          </div>

          {/* Tabs */}
          <div className="no-print" style={{
            background: '#fff', borderBottom: `1px solid ${COLORS.borderLight}`,
            position: 'sticky', top: 0, zIndex: 5,
            overflowX: 'auto', WebkitOverflowScrolling: 'touch'
          }}>
            <div style={{ display: 'flex', minWidth: 'max-content' }}>
              {tabs.map(t => (
                <button key={t.id} onClick={() => setTab(t.id)} style={{
                  padding: '12px 14px', border: 'none', cursor: 'pointer',
                  background: 'transparent',
                  color: tab === t.id ? COLORS.gold : COLORS.textMuted,
                  fontSize: 12, fontWeight: 700,
                  borderBottom: tab === t.id ? `2.5px solid ${COLORS.gold}` : '2.5px solid transparent',
                  display: 'inline-flex', alignItems: 'center', gap: 6,
                  whiteSpace: 'nowrap'
                }}>
                  <Icon name={t.icon} size={13} color={tab === t.id ? COLORS.gold : COLORS.textMuted} />
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          <div style={{ padding: 14 }}>
            {showFilter && (
              <div className="gfl-card gfl-fade-in no-print" style={{ marginBottom: 12 }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 8 }}>
                  <div>
                    <label style={{ fontSize: 10, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Dari</label>
                    <input type="date" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} className="gfl-input" />
                  </div>
                  <div>
                    <label style={{ fontSize: 10, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Sampai</label>
                    <input type="date" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} className="gfl-input" />
                  </div>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                  <select value={filter.shift} onChange={e => setFilter({ ...filter, shift: e.target.value })} className="gfl-input">
                    <option value="">Semua Shift</option>
                    <option value="1">Shift 1</option><option value="2">Shift 2</option><option value="3">Shift 3</option>
                  </select>
                  <select value={filter.leader} onChange={e => setFilter({ ...filter, leader: e.target.value })} className="gfl-input">
                    <option value="">Semua Leader</option>
                    {leaders.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                </div>
                <button onClick={() => setFilter({ from: '', to: '', shift: '', leader: '' })} style={{
                  background: 'none', border: 'none', color: COLORS.gold, fontSize: 12, fontWeight: 600, cursor: 'pointer', marginTop: 10
                }}>
                  Reset Filter
                </button>
              </div>
            )}

            {/* Action buttons */}
            <div className="no-print" style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
              <button onClick={exportExcel} className="gfl-btn gfl-btn-primary" style={{ flex: 1, padding: 12 }}>
                <Icon name="fileExcel" size={14} color="#fff" /> Export Excel
              </button>
              <button onClick={printPDF} className="gfl-btn gfl-btn-secondary" style={{ flex: 1, padding: 12 }}>
                <Icon name="printer" size={14} /> Print PDF
              </button>
            </div>

            {/* Summary cards always visible */}
            <div className="gfl-card" style={{ marginBottom: 14 }}>
              <h3 style={{ fontSize: 12, fontWeight: 800, color: COLORS.brown, marginBottom: 10, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                📊 Ringkasan Periode
              </h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8 }}>
                <SummaryItem label="Total Batch" value={formatNumber(summary.totalBatch)} color={COLORS.gold} />
                <SummaryItem label="Total Sak" value={formatNumber(summary.totalSak)} color={COLORS.brown} />
                <SummaryItem label="Total Gas" value={`${formatNumber(summary.totalGasSm3, 1)} Sm³`} color={COLORS.danger} />
                <SummaryItem label="Total Biaya" value={formatRupiah(summary.totalBiaya)} color={COLORS.success} />
                <SummaryItem label="Total Tepung" value={`${formatNumber(summary.totalTepung)} sak`} color={COLORS.info} />
                <SummaryItem label="Downtime" value={`${summary.totalDowntime}m`} color={COLORS.warning} />
              </div>
            </div>

            {filtered.length === 0 ? (
              <EmptyState icon="info" title="Tidak ada data" message="Coba ubah filter periode." />
            ) : (
              <>
                {tab === 'semua' && <TabSemua filtered={filtered} onNavigate={onNavigate} />}
                {tab === 'mixing' && <TabMixing filtered={filtered} />}
                {tab === 'drying' && <TabDrying filtered={filtered} />}
                {tab === 'gas' && <TabGas filtered={filtered} />}
                {tab === 'flour' && <TabFlour filtered={filtered} />}
                {tab === 'downtime' && <TabDowntime filtered={filtered} />}
              </>
            )}
          </div>
        </div>
      );
    }

    function SummaryItem({ label, value, color }) {
      return (
        <div style={{
          padding: 10, background: `${color}10`, borderRadius: 12,
          borderLeft: `3px solid ${color}`
        }}>
          <div style={{ fontSize: 9, color: COLORS.textMuted, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4 }}>{label}</div>
          <div style={{ fontSize: 14, color: COLORS.brown, fontWeight: 800, marginTop: 2 }}>{value}</div>
        </div>
      );
    }

    // ===== TAB COMPONENTS =====
    function TabSemua({ filtered, onNavigate }) {
      // Per-leader breakdown + list
      const leaderMap = {};
      filtered.forEach(r => {
        if (!leaderMap[r.leaderName]) leaderMap[r.leaderName] = { batch: 0, sak: 0, count: 0, gas: 0 };
        const t = calcReportTotals(r);
        leaderMap[r.leaderName].batch += t.totalBatch;
        leaderMap[r.leaderName].sak += t.totalSak;
        leaderMap[r.leaderName].gas += (r.gas?.sm3 || 0);
        leaderMap[r.leaderName].count++;
      });

      return (
        <>
          <div className="gfl-card" style={{ marginBottom: 14 }}>
            <h3 style={{ fontSize: 12, fontWeight: 800, color: COLORS.brown, marginBottom: 10, textTransform: 'uppercase' }}>
              👥 Per Leader
            </h3>

    // GENERIC LIST MANAGER (used by Master Data tabs)
    // ============================================================
    function GenericListManager({ items, onAdd, onUpdate, onDelete, label, placeholder = 'Nama' }) {
      const [editId, setEditId] = React.useState(null);
      const [editName, setEditName] = React.useState('');
      const [newName, setNewName] = React.useState('');

      function handleAdd() {
        if (!newName.trim()) return;
        onAdd({ id: Date.now(), name: newName.trim(), active: true });
        setNewName('');
      }
      function handleSaveEdit() {
        if (!editName.trim()) return;
        onUpdate(editId, { name: editName.trim() });
        setEditId(null); setEditName('');
      }

      return (
        <div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
            <input value={newName} onChange={e => setNewName(e.target.value)} placeholder={placeholder} className="gfl-input" style={{ flex: 1 }}
              onKeyDown={e => e.key === 'Enter' && handleAdd()} />
            <button onClick={handleAdd} className="gfl-btn gfl-btn-primary" style={{ padding: '10px 14px' }}>
              <Icon name="plus" size={14} color="#fff" />
            </button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {items.length === 0 ? (
              <div style={{ padding: 14, textAlign: 'center', fontSize: 12, color: COLORS.textMuted, fontStyle: 'italic' }}>
                Belum ada {label.toLowerCase()}.
              </div>
            ) : items.map(item => (
              <div key={item.id} style={{
                padding: 10, background: COLORS.creamLight, borderRadius: 10,
                display: 'flex', alignItems: 'center', gap: 8,
                opacity: item.active ? 1 : 0.5
              }}>
                {editId === item.id ? (
                  <>
                    <input value={editName} onChange={e => setEditName(e.target.value)} className="gfl-input" style={{ flex: 1 }}
                      onKeyDown={e => e.key === 'Enter' && handleSaveEdit()} autoFocus />
                    <button onClick={handleSaveEdit} className="gfl-btn gfl-btn-primary" style={{ padding: '6px 10px' }}>
                      <Icon name="check" size={12} color="#fff" />
                    </button>
                    <button onClick={() => { setEditId(null); setEditName(''); }} className="gfl-btn gfl-btn-secondary" style={{ padding: '6px 10px' }}>
                      <Icon name="x" size={12} />
                    </button>
                  </>
                ) : (
                  <>
                    <div style={{ flex: 1, fontSize: 12, fontWeight: 600, color: COLORS.brown }}>{item.name}</div>
                    <button onClick={() => onUpdate(item.id, { active: !item.active })} style={{
                      background: item.active ? COLORS.successLight : COLORS.dangerLight,
                      color: item.active ? COLORS.success : COLORS.danger,
                      border: 'none', borderRadius: 999, padding: '4px 10px',
                      cursor: 'pointer', fontSize: 10, fontWeight: 700
                    }}>
                      {item.active ? 'Aktif' : 'Off'}
                    </button>
                    <button onClick={() => { setEditId(item.id); setEditName(item.name); }} style={{
                      background: 'none', border: 'none', cursor: 'pointer', padding: 4
                    }}>
                      <Icon name="edit" size={12} color={COLORS.gold} />
                    </button>
                    <button onClick={() => { if (confirm(`Hapus "${item.name}"?`)) onDelete(item.id); }} style={{
                      background: 'none', border: 'none', cursor: 'pointer', padding: 4
                    }}>
                      <Icon name="trash" size={12} color={COLORS.danger} />
                    </button>
                  </>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function MasterDataPage({ currentUser, onNavigate, data, setData, showToast }) {
      const isAdmin = currentUser.role === 'Admin';
      const isSupervisor = currentUser.role === 'Supervisor';
      // Define accessible tabs based on role
      const allTabs = [
        { id: 'users', label: 'Users', icon: 'users', adminOnly: true },
        { id: 'products', label: 'Produk', icon: 'package', adminOnly: false },
        { id: 'machines', label: 'Mesin', icon: 'settings', adminOnly: false },
        { id: 'flour', label: 'Tepung', icon: 'archive', adminOnly: false },
        { id: 'operators', label: 'Operator', icon: 'users', adminOnly: false }, // NEW - Admin & Supervisor
        { id: 'gas', label: 'Gas', icon: 'flame', adminOnly: true },
        { id: 'log', label: 'Log', icon: 'activity', adminOnly: true },
      ];
      const accessibleTabs = allTabs.filter(t => isAdmin || (!t.adminOnly && (isSupervisor || t.id === 'operators')));
      const [tab, setTab] = React.useState(accessibleTabs[0]?.id || 'products');

      function logActivity(action, target, details = '') {
        return {
          id: Date.now(), timestamp: new Date().toISOString(),
          userId: currentUser.id, userName: currentUser.name,
          action, target, details
        };
      }

      // Generic update for list items
      function updateList(key, id, changes) {
        const newList = data[key].map(it => it.id === id ? { ...it, ...changes } : it);
        setData({ ...data, [key]: newList, activityLog: [...(data.activityLog || []), logActivity('master_update', `${key}: ${id}`, JSON.stringify(changes))] });
      }
      function deleteList(key, id) {
        const newList = data[key].filter(it => it.id !== id);
        setData({ ...data, [key]: newList, activityLog: [...(data.activityLog || []), logActivity('master_delete', `${key}: ${id}`)] });
        showToast('Dihapus', 'success');
      }
      function addList(key, item) {
        setData({ ...data, [key]: [...data[key], item], activityLog: [...(data.activityLog || []), logActivity('master_add', `${key}: ${item.name}`)] });
        showToast('Ditambahkan', 'success');
      }

      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream, paddingBottom: 80 }}>
          <PageHeader
            title="Master Data"
            subtitle="Kelola data dasar sistem"
            onBack={() => onNavigate('dashboard')}
            dark

          <div style={{
            background: '#fff', borderBottom: `1px solid ${COLORS.borderLight}`,
            position: 'sticky', top: 0, zIndex: 5, overflowX: 'auto', WebkitOverflowScrolling: 'touch'
          }}>
            <div style={{ display: 'flex', minWidth: 'max-content' }}>
              {accessibleTabs.map(t => (
                <button key={t.id} onClick={() => setTab(t.id)} style={{
                  padding: '12px 14px', border: 'none', cursor: 'pointer',
                  background: 'transparent',
                  color: tab === t.id ? COLORS.gold : COLORS.textMuted,
                  fontSize: 12, fontWeight: 700,
                  borderBottom: tab === t.id ? `2.5px solid ${COLORS.gold}` : '2.5px solid transparent',
                  display: 'inline-flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap'
                }}>
                  <Icon name={t.icon} size={13} color={tab === t.id ? COLORS.gold : COLORS.textMuted} />
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          <div style={{ padding: 14 }}>
            <div className="gfl-card">
              {tab === 'users' && isAdmin && (
                <UsersManagement data={data} setData={setData} showToast={showToast} currentUser={currentUser} />

                <>
                  <h3 style={{ fontSize: 14, fontWeight: 800, color: COLORS.brown, marginBottom: 10 }}>📦 Daftar Produk</h3>

    function UsersManagement({ data, setData, showToast, currentUser }) {
      const [editing, setEditing] = React.useState(null);
      const [showForm, setShowForm] = React.useState(false);

      function handleSave(form) {
        if (!form.name || !form.email) { showToast('Nama & Email wajib', 'error'); return; }
        let newUsers;
        if (editing && editing.id) {
          newUsers = data.users.map(u => u.id === editing.id ? { ...u, ...form } : u);
        } else {
          newUsers = [...data.users, { ...form, id: Date.now(), joinDate: new Date().toISOString().split('T')[0] }];
        }
        setData({ ...data, users: newUsers,
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: editing?.id ? 'user_update' : 'user_create', target: form.name, details: ''
          }]
        });
        setEditing(null); setShowForm(false);
        showToast('Tersimpan', 'success');
      }

      function handleDelete(u) {
        if (u.id === currentUser.id) { showToast('Tidak bisa hapus diri sendiri', 'error'); return; }
        if (!confirm(`Hapus user ${u.name}?`)) return;
        setData({ ...data, users: data.users.filter(x => x.id !== u.id),
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'user_delete', target: u.name, details: ''
          }]
        });
        showToast('User dihapus', 'success');
      }

      return (
        <>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
            <h3 style={{ fontSize: 14, fontWeight: 800, color: COLORS.brown }}>👥 Daftar User</h3>
            <button onClick={() => { setEditing({}); setShowForm(true); }} className="gfl-btn gfl-btn-primary" style={{ padding: '6px 12px', fontSize: 11 }}>
              <Icon name="plus" size={12} color="#fff" /> User
            </button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {data.users.map(u => (
              <div key={u.id} style={{
                padding: 12, background: COLORS.creamLight, borderRadius: 12,

              }}>

                    <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.brown }}>{u.name}</div>

                    <Badge color={u.role === 'Admin' ? COLORS.danger : u.role === 'Supervisor' ? COLORS.info : COLORS.gold}>{u.role}</Badge>
                  </div>
                  <button onClick={() => { setEditing(u); setShowForm(true); }} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 6 }}>

    // ============================================================
    // MAIN APP
    // ============================================================
    function App() {
      const [data, setData] = React.useState(() => loadData());
      const [session, setSession] = React.useState(() => loadSession());
      const [page, setPage] = React.useState('dashboard');
      const [pageParams, setPageParams] = React.useState({});
      const [toast, setToast] = React.useState(null);

      // Derive currentUser fresh from data + session - this fixes the "name reverts" bug
      const currentUser = React.useMemo(() => {
        if (!session) return null;
        return data.users.find(u => u.id === session.userId && u.active) || null;
      }, [session, data.users]);

      // Save data to localStorage on change
      React.useEffect(() => { saveData(data); }, [data]);

      // If session exists but user not found (deleted/disabled), clear session
      React.useEffect(() => {
        if (session && !currentUser) {
          saveSession(null);
          setSession(null);
        }
      }, [session, currentUser]);

      function showToast(msg, type = 'info') {
        setToast({ msg, type });
      }

      function handleLogin(user) {
        saveSession(user.id);
        setSession({ userId: user.id, loginAt: Date.now() });
        setPage('dashboard');
        showToast(`Selamat datang, ${user.name}!`, 'success');
      }

      function handleLogout() {
        saveSession(null);
        setSession(null);
        setPage('dashboard');
        setPageParams({});
      }

      function navigate(p, params = {}) {
        setPage(p);
        setPageParams(params);
        window.scrollTo({ top: 0 });
      }

      // Login screen
      if (!currentUser) {
        return (
          <>
            <LoginPage onLogin={handleLogin} data={data} />
            {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
          </>
        );
      }

      const isViewer = currentUser.role === 'Viewer';
      const canApprove = currentUser.role === 'Admin' || currentUser.role === 'Supervisor';
      const pendingEditCount = (data.editRequests || []).filter(r => r.status === 'pending').length;

      // Bottom nav items
      const navItems = [
        { id: 'dashboard', label: 'Beranda', icon: 'home' },
        ...(isViewer ? [] : [{ id: 'input-laporan', label: 'Input', icon: 'plus' }]),
        { id: 'monitoring', label: 'Monitoring', icon: 'list' },
        { id: 'mutasi-laporan', label: 'Mutasi', icon: 'chart' },
        ...(canApprove && pendingEditCount > 0 ? [{ id: 'approval', label: 'Approval', icon: 'bell', badge: pendingEditCount }] : []),
        { id: 'profile', label: 'Profil', icon: 'user' },
      ];

      // Pages where bottom nav is hidden
      const hideNavPages = ['input-laporan', 'laporan-detail'];
      const showBottomNav = !hideNavPages.includes(page);

      // Master Data is accessible from profile, but we add it as button in dashboard for admin/supervisor

      return (
        <>
          {page === 'dashboard' && (
            <DashboardWrapper
              currentUser={currentUser} data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
            />
          )}
          {page === 'input-laporan' && !isViewer && (
            <InputLaporanWizard
              currentUser={currentUser} data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
              initialDraft={pageParams.draft}
              editReport={pageParams.editReport}
              editMode={pageParams.editMode}
            />
          )}
          {page === 'monitoring' && (
            <MonitoringPage
              currentUser={currentUser} data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
            />
          )}
          {page === 'mutasi-laporan' && (
            <MutasiLaporanPage
              currentUser={currentUser} data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
              initialTab={pageParams.tab}
            />
          )}
          {page === 'laporan-detail' && pageParams.report && (
            <LaporanDetailPage
              report={pageParams.report} currentUser={currentUser}
              data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
              autoPrint={pageParams.autoPrint} autoJpeg={pageParams.autoJpeg}
            />
          )}
          {page === 'approval' && canApprove && (
            <ApprovalPage
              currentUser={currentUser} data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
            />
          )}
          {page === 'master-data' && (currentUser.role === 'Admin' || currentUser.role === 'Supervisor') && (
            <MasterDataPage
              currentUser={currentUser} data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
            />
          )}
          {page === 'profile' && (
            <ProfilePage
              currentUser={currentUser} data={data} setData={setData}
              onNavigate={navigate} showToast={showToast}
              onLogout={handleLogout}
            />
          )}

          {/* BOTTOM NAV */}
          {showBottomNav && (
            <BottomNav
              items={navItems} active={page}
              onNavigate={navigate}
              currentUser={currentUser}
            />
          )}

          {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
        </>
      );
    }

    // Wrapper to add Master Data quick access at top
    function DashboardWrapper({ currentUser, data, setData, onNavigate, showToast }) {
      const canMaster = currentUser.role === 'Admin' || currentUser.role === 'Supervisor';
      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream }}>
          <TodayDashboard currentUser={currentUser} onNavigate={onNavigate} data={data} />
          {canMaster && (
            <div style={{ padding: '0 16px 16px' }}>
              <button onClick={() => onNavigate('master-data')} className="gfl-card gfl-card-hover" style={{
                width: '100%', padding: 14, cursor: 'pointer', border: 'none',
                display: 'flex', alignItems: 'center', gap: 10, textAlign: 'left'
              }}>
                <div style={{
                  width: 36, height: 36, borderRadius: 12, background: `${COLORS.gold}18`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center'
                }}>
                  <Icon name="settings" size={18} color={COLORS.gold} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.brown }}>Master Data</div>
                  <div style={{ fontSize: 11, color: COLORS.textMuted }}>Kelola users, produk, mesin, operator, gas, log</div>
                </div>
                <Icon name="chevronRight" size={16} color={COLORS.gold} />
              </button>
            </div>
          )}
        </div>
      );
    }

    function BottomNav({ items, active, onNavigate, currentUser }) {
      return (
        <div className="no-print" style={{
          position: 'fixed', bottom: 0, left: 0, right: 0,
          background: '#fff', borderTop: `1px solid ${COLORS.borderLight}`,
          padding: '8px 0 calc(8px + env(safe-area-inset-bottom))',
          boxShadow: '0 -4px 16px rgba(0,0,0,0.06)', zIndex: 50,
          maxWidth: 430, margin: '0 auto'
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-around', alignItems: 'center' }}>
            {items.map(it => {
              const isActive = active === it.id;
              return (
                <button key={it.id} onClick={() => onNavigate(it.id)} style={{
                  background: 'transparent', border: 'none', cursor: 'pointer',
                  padding: '6px 4px', display: 'flex', flexDirection: 'column',
                  alignItems: 'center', gap: 3, position: 'relative',
                  minWidth: 48
                }}>
                  <div style={{ position: 'relative' }}>
                    <Icon name={it.icon} size={20} color={isActive ? COLORS.gold : COLORS.textMuted} />
                    {it.badge > 0 && (
                      <div style={{
                        position: 'absolute', top: -4, right: -8,
                        background: COLORS.danger, color: '#fff',
                        fontSize: 9, fontWeight: 700,
                        minWidth: 16, height: 16, borderRadius: 999,
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        padding: '0 4px'
                      }}>
                        {it.badge}
                      </div>
                    )}
                  </div>
                  <span style={{
                    fontSize: 10, fontWeight: 700,
                    color: isActive ? COLORS.gold : COLORS.textMuted
                  }}>
                    {it.label}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ============================================================
    // RENDER
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
