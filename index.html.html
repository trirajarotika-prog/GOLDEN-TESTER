<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Golden Food Production — CV Golden Food Lestari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%; width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F5EFE2; color: #2C1A0E;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body { overflow-x: hidden; }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4B896; border-radius: 4px; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    * { -webkit-tap-highlight-color: transparent; }

    .gfl-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #E8DCC4;
      border-radius: 12px; font-size: 14px; background: #fff;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: #2C1A0E;
    }
    .gfl-input:focus { outline: none; border-color: #B8860B; box-shadow: 0 0 0 4px rgba(184,134,11,0.10); }
    .gfl-input:disabled { background: #F5EFE2; color: #7A6248; }

    .gfl-btn {
      padding: 12px 20px; border: none; border-radius: 999px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.2px;
    }
    .gfl-btn-primary {
      background: linear-gradient(135deg, #B8860B 0%, #DAA520 100%);
      color: #fff; box-shadow: 0 4px 14px rgba(184,134,11,0.35);
    }
    .gfl-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(184,134,11,0.45); }
    .gfl-btn-primary:active { transform: translateY(0); }
    .gfl-btn-secondary { background: #fff; color: #5C3317; border: 1.5px solid #E8DCC4; }
    .gfl-btn-secondary:hover { border-color: #B8860B; color: #B8860B; }
    .gfl-btn-danger { background: #C0392B; color: #fff; box-shadow: 0 4px 14px rgba(192,57,43,0.3); }
    .gfl-btn-ghost { background: transparent; color: #5C3317; }
    .gfl-btn-ghost:hover { background: rgba(184,134,11,0.08); }

    .gfl-card {
      background: #fff; border-radius: 20px; padding: 18px;
      box-shadow: 0 2px 8px rgba(92,51,23,0.04), 0 1px 2px rgba(92,51,23,0.06);
      border: 1px solid rgba(232,220,196,0.6);
      transition: box-shadow 0.2s;
    }
    .gfl-card-hover:hover { box-shadow: 0 8px 24px rgba(92,51,23,0.10), 0 2px 4px rgba(92,51,23,0.06); }

    .gfl-fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .gfl-slide-up { animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media print {
      body, html, #root { background: #fff !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .gfl-card {
        box-shadow: none !important; border: 1px solid #ccc !important;
        page-break-inside: avoid;
      }
      @page { size: A4 portrait; margin: 12mm 14mm; }
      #root { max-width: 100% !important; box-shadow: none !important; }
    }
    .print-only { display: none; }

    @media (min-width: 480px) {
      #root {
        max-width: 430px; margin: 0 auto;
        box-shadow: 0 0 60px rgba(0,0,0,0.12);
        min-height: 100vh; background: #F5EFE2;
      }
    }
  </style>

    const STORAGE_KEY = 'gfl_app_data_v5';
    const SESSION_KEY = 'gfl_session_v5';

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return migrateData(JSON.parse(saved));
      } catch (e) { console.error(e); }
      return JSON.parse(JSON.stringify(INITIAL_DATA));
    }

    // Migrate old data structure (v4) to new (v5)
    function migrateData(data) {
      if (!data) return JSON.parse(JSON.stringify(INITIAL_DATA));
      // Ensure required fields exist
      if (!data.editRequests) data.editRequests = [];
      if (!data.drafts) data.drafts = [];
      if (!data.deletedReports) data.deletedReports = [];
      if (!data.activityLog) data.activityLog = [];
      if (!data.operators && data.employees) data.operators = data.employees;
      if (!data.operators) data.operators = JSON.parse(JSON.stringify(INITIAL_DATA.operators));
      if (!data.gasConfig.initialMeter) data.gasConfig.initialMeter = 0;

      // Migrate reports: old structure had productName + plannings on machine,
      // new has products[] each with own plannings.
      function migrateMachineList(arr, isMixing) {
        return (arr || []).map(m => {
          if (m.products) return m; // already new format
          // convert
          const out = { ...m, products: [] };
          if (m.productName !== undefined || m.plannings) {
            out.products = [{
              id: 1,
              productName: m.productName || '',
              plannings: (m.plannings || []).map((p, i) => ({ ...p, id: p.id || (i + 1) }))
            }];
            delete out.productName;
            delete out.plannings;
          }
          return out;
        });
      }
      data.reports = (data.reports || []).map(r => ({
        ...r,
        mixing: migrateMachineList(r.mixing, true),
        drying: migrateMachineList(r.drying, false),
      }));
      data.drafts = (data.drafts || []).map(d => ({
        ...d,
        mixing: migrateMachineList(d.mixing, true),
        drying: migrateMachineList(d.drying, false),
      }));
      return data;
    }

    function saveData(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (e) { console.error('Failed to save:', e); }
    }

    function loadSession() {
      try {
        const s = localStorage.getItem(SESSION_KEY);
        if (s) return JSON.parse(s);
      } catch (e) {}
      return null;
    }
    function saveSession(userId) {
      try {
        if (userId === null) localStorage.removeItem(SESSION_KEY);
        else localStorage.setItem(SESSION_KEY, JSON.stringify({ userId, loginAt: Date.now() }));
      } catch (e) {}
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }
    function formatDateShort(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('id-ID');
    }
    function formatRupiah(num) { return 'Rp ' + Math.round(num || 0).toLocaleString('id-ID'); }
    function formatNumber(num, decimals = 0) {
      if (num === null || num === undefined) return '-';
      return Number(num).toLocaleString('id-ID', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }
    function calcGasSm3(meterStart, meterEnd, gasConfig) {
      const A = meterEnd - meterStart;
      const B = (gasConfig.pressureOut + 1.01325) / 1.01325;
      const C = 300 / (gasConfig.temperature + 273);
      return A * B * C * 1.002;
    }
    function shiftLabel(s) {
      return ['Shift 1 (23:30-07:30)', 'Shift 2 (07:30-15:30)', 'Shift 3 (15:30-23:30)'][s - 1] || `Shift ${s}`;
    }
    function downloadFile(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    // Calculate report totals from new structure
    function calcReportTotals(r) {
      let totalBatch = 0, totalSak = 0;
      (r.mixing || []).forEach(m => {
        (m.products || []).forEach(prod => {
          (prod.plannings || []).forEach(p => totalBatch += (p.batches || 0));
        });
      });
      (r.drying || []).forEach(d => {
        (d.products || []).forEach(prod => {
          (prod.plannings || []).forEach(p => totalSak += (p.sacks || 0));
        });
      });
      const totalDowntime = (r.downtime || []).reduce((s, d) => s + (d.duration || 0), 0);
      const totalTepung = (r.flour || []).reduce((s, f) => s + (f.amount || 0), 0);
      return { totalBatch, totalSak, totalDowntime, totalTepung };
    }

    // Edit window check
    function getEditStatus(report) {
      if (!report.submittedAt) return { canEdit: false, label: '-', color: COLORS.textMuted };
      const elapsed = Date.now() - new Date(report.submittedAt).getTime();
      if (elapsed < EDIT_WINDOW_MS) {
        const remainMin = Math.floor((EDIT_WINDOW_MS - elapsed) / 60000);
        return {
          canEdit: true, needApproval: false,
          label: `Bisa edit (sisa ${remainMin}m)`,
          color: COLORS.success
        };
      }
      return {
        canEdit: false, needApproval: true,
        label: 'Perlu pengajuan',
        color: COLORS.warning
      };
    }

    function timeAgo(timestamp) {
      const elapsed = Date.now() - new Date(timestamp).getTime();
      const min = Math.floor(elapsed / 60000);
      if (min < 1) return 'baru saja';
      if (min < 60) return `${min} menit lalu`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr} jam lalu`;
      return `${Math.floor(hr / 24)} hari lalu`;
    }

    // Stable inputs - prevents focus loss bug
    function StableNumberInput({ value, onChange, placeholder, allowDecimal = false, style = {}, disabled = false }) {
      const [local, setLocal] = React.useState(value === 0 || value === null || value === undefined ? '' : String(value));
      const lastValueRef = React.useRef(value);
      React.useEffect(() => {
        if (value !== lastValueRef.current) {
          setLocal(value === 0 || value === null || value === undefined ? '' : String(value));
          lastValueRef.current = value;
        }
      }, [value]);
      function handleChange(e) {
        const v = e.target.value;
        const regex = allowDecimal ? /^\d*\.?\d*$/ : /^\d*$/;
        if (v === '' || regex.test(v)) {
          setLocal(v);
          const num = v === '' ? 0 : (allowDecimal ? parseFloat(v) : parseInt(v, 10));
          if (!isNaN(num)) {
            lastValueRef.current = num; onChange(num);
          } else if (v === '') {
            lastValueRef.current = 0; onChange(0);
          }
        }
      }
      function handleBlur() {
        if (local === '' || local === '.') { setLocal(''); lastValueRef.current = 0; onChange(0); }
      }
      return (
        <input
          type="text" inputMode={allowDecimal ? "decimal" : "numeric"}
          pattern={allowDecimal ? "[0-9]*\\.?[0-9]*" : "[0-9]*"}
          value={local} onChange={handleChange} onBlur={handleBlur}
          placeholder={placeholder} className="gfl-input" style={style} disabled={disabled}
        />
      );
    }
    function StableTextInput({ value, onChange, placeholder, style = {}, disabled = false }) {
      const [local, setLocal] = React.useState(value || '');
      const lastValueRef = React.useRef(value);
      React.useEffect(() => {
        if (value !== lastValueRef.current) { setLocal(value || ''); lastValueRef.current = value; }
      }, [value]);
      function handleChange(e) {
        const v = e.target.value;
        setLocal(v); lastValueRef.current = v; onChange(v);
      }
      return <input type="text" value={local} onChange={handleChange} placeholder={placeholder} className="gfl-input" style={style} disabled={disabled} />;
    }
    function StableTextarea({ value, onChange, placeholder, rows = 2, style = {} }) {
      const [local, setLocal] = React.useState(value || '');
      const lastValueRef = React.useRef(value);
      React.useEffect(() => {
        if (value !== lastValueRef.current) { setLocal(value || ''); lastValueRef.current = value; }
      }, [value]);
      function handleChange(e) {
        const v = e.target.value;
        setLocal(v); lastValueRef.current = v; onChange(v);
      }
      return <textarea value={local} onChange={handleChange} placeholder={placeholder} rows={rows} className="gfl-input" style={{ resize: 'vertical', minHeight: 60, ...style }} />;
    }

    function SearchableSelect({ value, onChange, options, placeholder = 'Pilih...', disabled = false, multiple = false, allowEmpty = false }) {
      const [open, setOpen] = React.useState(false);
      const [search, setSearch] = React.useState('');
      const ref = React.useRef(null);
      const searchRef = React.useRef(null);

      React.useEffect(() => {
        function handleClick(e) {
          if (ref.current && !ref.current.contains(e.target)) {
            setOpen(false); setSearch('');
          }
        }
        if (open) document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, [open]);

      React.useEffect(() => {
        if (open && searchRef.current) setTimeout(() => searchRef.current?.focus(), 50);
      }, [open]);

      const filtered = options.filter(opt => {
        const label = typeof opt === 'string' ? opt : opt.label || opt.name;
        return label.toLowerCase().includes(search.toLowerCase());
      });

      const getLabel = (val) => {
        if (val === null || val === undefined || val === '') return placeholder;
        if (multiple && Array.isArray(val)) {
          if (val.length === 0) return placeholder;
          return val.length === 1 ? val[0] : `${val[0]} +${val.length - 1} lainnya`;
        }
        return val;
      };

      return (
        <div ref={ref} style={{ position: 'relative', width: '100%' }}>
          <div onClick={() => !disabled && setOpen(!open)} className="gfl-input" style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            cursor: disabled ? 'not-allowed' : 'pointer',
            background: disabled ? COLORS.cream : '#fff',
            color: (multiple ? (Array.isArray(value) && value.length > 0) : value) ? COLORS.text : COLORS.textMuted,
          }}>
            <span style={{ fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{getLabel(value)}</span>
            <Icon name="chevronDown" size={16} color={COLORS.textMuted} />
          </div>
          {open && (
            <div className="gfl-fade-in" style={{
              position: 'absolute', top: '100%', left: 0, right: 0, marginTop: 6,
              background: '#fff', border: `1px solid ${COLORS.border}`, borderRadius: 14,
              boxShadow: '0 12px 32px rgba(92,51,23,0.15)', zIndex: 100, maxHeight: 280, overflow: 'hidden',
              display: 'flex', flexDirection: 'column'
            }}>
              <div style={{ padding: 8, borderBottom: `1px solid ${COLORS.borderLight}` }}>
                <input ref={searchRef} type="text" value={search} onChange={e => setSearch(e.target.value)}
                  placeholder="Cari..." className="gfl-input" style={{ fontSize: 13, padding: '8px 12px' }} />
              </div>
              <div style={{ overflow: 'auto', maxHeight: 220 }}>
                {allowEmpty && !multiple && (
                  <div onClick={() => { onChange(''); setOpen(false); setSearch(''); }} style={{
                    padding: '10px 14px', cursor: 'pointer', fontSize: 13, color: COLORS.textMuted, fontStyle: 'italic'
                  }}>(Kosongkan)</div>
                )}
                {filtered.length === 0 ? (
                  <div style={{ padding: 12, textAlign: 'center', color: COLORS.textMuted, fontSize: 13 }}>Tidak ada hasil</div>
                ) : filtered.map((opt, idx) => {
                  const label = typeof opt === 'string' ? opt : opt.label || opt.name;
                  const val = typeof opt === 'string' ? opt : opt.value || opt.name;
                  const isSelected = multiple ? Array.isArray(value) && value.includes(val) : value === val;
                  return (
                    <div key={idx} onClick={() => {
                      if (multiple) {
                        const newVal = Array.isArray(value) ? [...value] : [];
                        const i = newVal.indexOf(val);
                        if (i >= 0) newVal.splice(i, 1); else newVal.push(val);
                        onChange(newVal);
                      } else {
                        onChange(val); setOpen(false); setSearch('');
                      }
                    }} style={{
                      padding: '10px 14px', cursor: 'pointer', fontSize: 13,
                      background: isSelected ? COLORS.goldPale : 'transparent',
                      color: isSelected ? COLORS.brown : COLORS.text,
                      fontWeight: isSelected ? 600 : 400,
                      borderBottom: `1px solid ${COLORS.borderLight}`,
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between'
                    }}>
                      <span>{label}</span>
                      {isSelected && <Icon name="check" size={14} color={COLORS.gold} />}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // INPUT LAPORAN WIZARD - Main
    // mode: 'create' | 'edit-direct' | 'edit-request'
    // ============================================================
    function InputLaporanWizard({ currentUser, onNavigate, data, setData, showToast, initialDraft, editReport, editMode }) {
      const isEditing = !!editReport;
      const [showDraftModal, setShowDraftModal] = React.useState(false);
      const [showSuccess, setShowSuccess] = React.useState(null);
      const [showReasonModal, setShowReasonModal] = React.useState(false);
      const [pendingSubmitReport, setPendingSubmitReport] = React.useState(null);

      React.useEffect(() => {
        if (!initialDraft && !isEditing) {
          const myDrafts = (data.drafts || []).filter(d => d.leaderId === currentUser.id);
          if (myDrafts.length > 0) setShowDraftModal(true);
        }
      }, []);

      const baseData = editReport || initialDraft || {};
      const [step, setStep] = React.useState(1);
      const [draftId, setDraftId] = React.useState(initialDraft?.id || null);

      // Step 1: Info Dasar
      const [tanggal, setTanggal] = React.useState(baseData.date || new Date().toISOString().split('T')[0]);
      const [shift, setShift] = React.useState(baseData.shift || 1);
      const [mixingActive, setMixingActive] = React.useState(baseData.mixingActive ?? true);
      const [dryingActive, setDryingActive] = React.useState(baseData.dryingActive ?? true);

      // Step 2: Mixing - new structure (1 machine -> products[] -> plannings[])
      const [mixing, setMixing] = React.useState(baseData.mixing && baseData.mixing.length > 0 ? baseData.mixing : [
        { id: 1, machineName: '', products: [{ id: 1, productName: '', plannings: [{ id: 1, noPlanning: '', batches: 0 }] }] }
      ]);
      const [flour, setFlour] = React.useState(baseData.flour && baseData.flour.length > 0 ? baseData.flour : [{ id: 1, brand: '', amount: 0, unit: 'sak' }]);
      const [ragi, setRagi] = React.useState(baseData.ragi || 0);

      // Step 3: Drying
      const [drying, setDrying] = React.useState(baseData.drying && baseData.drying.length > 0 ? baseData.drying : [
        { id: 1, machineNo: '', products: [{ id: 1, productName: '', plannings: [{ id: 1, noPlanning: '', sacks: 0 }] }] }
      ]);
      const [meterStart, setMeterStart] = React.useState(baseData.gas?.meterStart || 0);
      const [meterEnd, setMeterEnd] = React.useState(baseData.gas?.meterEnd || 0);
      const [gasNote, setGasNote] = React.useState(baseData.gas?.note || '');

      // Step 4-5
      const [workforce, setWorkforce] = React.useState(baseData.workforce || { mixing: [], baking: [], drying: [], indexing: [], note: '' });
      const [downtime, setDowntime] = React.useState(baseData.downtime || []);
      const [generalNote, setGeneralNote] = React.useState(baseData.generalNote || '');

      // Auto-fill meter start
      React.useEffect(() => {
        if (!isEditing && !initialDraft && meterStart === 0) {
          const lastReport = [...data.reports].sort((a, b) =>
            new Date(b.submittedAt || b.date) - new Date(a.submittedAt || a.date))[0];
          if (lastReport) setMeterStart(lastReport.gas?.meterEnd || data.gasConfig.initialMeter || 0);
          else setMeterStart(data.gasConfig.initialMeter || 0);
        }
      }, []);

      // Calculations
      const targetTepung = React.useMemo(() => {
        if (!mixingActive) return 0;
        let total = 0;
        mixing.forEach(m => {
          let totalBatch = 0;
          (m.products || []).forEach(prod => {
            (prod.plannings || []).forEach(p => totalBatch += (p.batches || 0));
          });
          if (m.machineName === 'Mixer Kecil') total += totalBatch * 1.4;
          else if (m.machineName === 'Mixer Besar') total += totalBatch * 6;
        });
        return Math.round(total * 100) / 100;
      }, [mixing, mixingActive]);

      const totalFlourInput = React.useMemo(() => flour.reduce((s, f) => s + (f.amount || 0), 0), [flour]);
      const flourDiff = totalFlourInput - targetTepung;
      const flourValid = Math.abs(flourDiff) <= 1;

      const gasSelisihM3 = Math.max(0, meterEnd - meterStart);
      const gasSm3 = gasSelisihM3 > 0 ? calcGasSm3(meterStart, meterEnd, data.gasConfig) : 0;
      const gasBiaya = gasSm3 * data.gasConfig.pricePerSm3;

      const productOptions = data.products.filter(p => p.active).map(p => p.name);
      const mixerOptions = data.machines.filter(m => m.active && m.category === 'Mixing').map(m => m.name);
      const dryerOptions = data.machines.filter(m => m.active && m.category === 'Drying').map(m => m.name);
      const flourOptions = data.flourBrands.filter(f => f.active).map(f => f.name);
      const operatorOptions = (data.operators || []).filter(e => e.active).map(e => e.name);

      // === Mixing handlers ===
      function addMixingMachine() {
        setMixing([...mixing, { id: Date.now(), machineName: '', products: [{ id: Date.now() + 1, productName: '', plannings: [{ id: Date.now() + 2, noPlanning: '', batches: 0 }] }] }]);
      }
      function updateMixingMachine(idx, field, val) {
        const n = [...mixing]; n[idx] = { ...n[idx], [field]: val }; setMixing(n);
      }
      function removeMixingMachine(idx) { setMixing(mixing.filter((_, i) => i !== idx)); }
      function addMixingProduct(mIdx) {
        const n = [...mixing];
        n[mIdx] = { ...n[mIdx], products: [...(n[mIdx].products || []), { id: Date.now(), productName: '', plannings: [{ id: Date.now() + 1, noPlanning: '', batches: 0 }] }] };
        setMixing(n);
      }
      function updateMixingProduct(mIdx, pIdx, field, val) {
        const n = [...mixing];
        n[mIdx] = { ...n[mIdx], products: [...n[mIdx].products] };
        n[mIdx].products[pIdx] = { ...n[mIdx].products[pIdx], [field]: val };
        setMixing(n);
      }
      function removeMixingProduct(mIdx, pIdx) {
        const n = [...mixing];
        n[mIdx] = { ...n[mIdx], products: n[mIdx].products.filter((_, i) => i !== pIdx) };
        setMixing(n);
      }
      function addMixingPlanning(mIdx, pIdx) {
        const n = [...mixing];
        n[mIdx] = { ...n[mIdx], products: [...n[mIdx].products] };
        n[mIdx].products[pIdx] = { ...n[mIdx].products[pIdx], plannings: [...n[mIdx].products[pIdx].plannings, { id: Date.now(), noPlanning: '', batches: 0 }] };
        setMixing(n);
      }
      function updateMixingPlanning(mIdx, pIdx, plIdx, field, val) {
        const n = [...mixing];
        n[mIdx] = { ...n[mIdx], products: [...n[mIdx].products] };
        n[mIdx].products[pIdx] = { ...n[mIdx].products[pIdx], plannings: [...n[mIdx].products[pIdx].plannings] };
        n[mIdx].products[pIdx].plannings[plIdx] = { ...n[mIdx].products[pIdx].plannings[plIdx], [field]: val };
        setMixing(n);
      }
      function removeMixingPlanning(mIdx, pIdx, plIdx) {
        const n = [...mixing];
        n[mIdx] = { ...n[mIdx], products: [...n[mIdx].products] };
        n[mIdx].products[pIdx] = { ...n[mIdx].products[pIdx], plannings: n[mIdx].products[pIdx].plannings.filter((_, i) => i !== plIdx) };
        setMixing(n);
      }

      // === Drying handlers (parallel) ===
      function addDryingMachine() {
        setDrying([...drying, { id: Date.now(), machineNo: '', products: [{ id: Date.now() + 1, productName: '', plannings: [{ id: Date.now() + 2, noPlanning: '', sacks: 0 }] }] }]);
      }
      function updateDryingMachine(idx, field, val) {
        const n = [...drying]; n[idx] = { ...n[idx], [field]: val }; setDrying(n);
      }
      function removeDryingMachine(idx) { setDrying(drying.filter((_, i) => i !== idx)); }
      function addDryingProduct(dIdx) {
        const n = [...drying];
        n[dIdx] = { ...n[dIdx], products: [...(n[dIdx].products || []), { id: Date.now(), productName: '', plannings: [{ id: Date.now() + 1, noPlanning: '', sacks: 0 }] }] };
        setDrying(n);
      }
      function updateDryingProduct(dIdx, pIdx, field, val) {
        const n = [...drying];
        n[dIdx] = { ...n[dIdx], products: [...n[dIdx].products] };
        n[dIdx].products[pIdx] = { ...n[dIdx].products[pIdx], [field]: val };
        setDrying(n);
      }
      function removeDryingProduct(dIdx, pIdx) {
        const n = [...drying];
        n[dIdx] = { ...n[dIdx], products: n[dIdx].products.filter((_, i) => i !== pIdx) };
        setDrying(n);
      }
      function addDryingPlanning(dIdx, pIdx) {
        const n = [...drying];
        n[dIdx] = { ...n[dIdx], products: [...n[dIdx].products] };
        n[dIdx].products[pIdx] = { ...n[dIdx].products[pIdx], plannings: [...n[dIdx].products[pIdx].plannings, { id: Date.now(), noPlanning: '', sacks: 0 }] };
        setDrying(n);
      }
      function updateDryingPlanning(dIdx, pIdx, plIdx, field, val) {
        const n = [...drying];
        n[dIdx] = { ...n[dIdx], products: [...n[dIdx].products] };
        n[dIdx].products[pIdx] = { ...n[dIdx].products[pIdx], plannings: [...n[dIdx].products[pIdx].plannings] };
        n[dIdx].products[pIdx].plannings[plIdx] = { ...n[dIdx].products[pIdx].plannings[plIdx], [field]: val };
        setDrying(n);
      }
      function removeDryingPlanning(dIdx, pIdx, plIdx) {
        const n = [...drying];
        n[dIdx] = { ...n[dIdx], products: [...n[dIdx].products] };
        n[dIdx].products[pIdx] = { ...n[dIdx].products[pIdx], plannings: n[dIdx].products[pIdx].plannings.filter((_, i) => i !== plIdx) };
        setDrying(n);
      }

      // === Flour & Downtime ===
      function addFlour() { setFlour([...flour, { id: Date.now(), brand: '', amount: 0, unit: 'sak' }]); }
      function updateFlour(idx, field, val) { const n = [...flour]; n[idx] = { ...n[idx], [field]: val }; setFlour(n); }
      function removeFlour(idx) { setFlour(flour.filter((_, i) => i !== idx)); }

      function addDowntime() { setDowntime([...downtime, { id: Date.now(), machineName: '', startTime: '', endTime: '', duration: 0, category: '', detailMachine: '', detailReason: '' }]); }
      function updateDowntime(idx, field, val) {
        const n = [...downtime];
        n[idx] = { ...n[idx], [field]: val };
        if (field === 'startTime' || field === 'endTime') {
          const s = n[idx].startTime, e = n[idx].endTime;
          if (s && e) {
            const [sh, sm] = s.split(':').map(Number);
            const [eh, em] = e.split(':').map(Number);
            let dur = (eh * 60 + em) - (sh * 60 + sm);
            if (dur < 0) dur += 24 * 60;
            n[idx].duration = dur;
          }
        }
        setDowntime(n);
      }
      function removeDowntime(idx) { setDowntime(downtime.filter((_, i) => i !== idx)); }

      function buildReport() {
        return {
          date: tanggal, shift,
          leaderId: editReport?.leaderId || currentUser.id,
          leaderName: editReport?.leaderName || currentUser.name,
          generalNote, mixingActive, dryingActive,
          mixing: mixingActive ? mixing : [],
          flour: mixingActive ? flour : [],
          ragi: mixingActive ? ragi : 0,
          drying: dryingActive ? drying : [],
          workforce, downtime,
          gas: { meterStart, meterEnd, sm3: gasSm3, biaya: gasBiaya, note: gasNote }
        };
      }

      function handleSaveDraft() {
        if (isEditing) return;
        const draftData = {
          ...buildReport(), id: draftId || Date.now(),
          currentStep: step, savedAt: new Date().toISOString(), isDraft: true
        };
        let newDrafts = data.drafts || [];
        if (draftId) newDrafts = newDrafts.map(d => d.id === draftId ? draftData : d);
        else { newDrafts = [...newDrafts, draftData]; setDraftId(draftData.id); }
        setData({ ...data, drafts: newDrafts });
        showToast('Draft tersimpan', 'success');
      }

      function autoSaveDraft(currentStepNum) {
        if (isEditing) return;
        const draftData = {
          ...buildReport(), id: draftId || Date.now(),
          currentStep: currentStepNum, savedAt: new Date().toISOString(), isDraft: true
        };
        let newDrafts = data.drafts || [];
        if (draftId) newDrafts = newDrafts.map(d => d.id === draftId ? draftData : d);
        else { newDrafts = [...newDrafts, draftData]; setDraftId(draftData.id); }
        setData({ ...data, drafts: newDrafts });
      }

      function goNext() {
        if (step < 6) {
          autoSaveDraft(step + 1);
          setStep(step + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else handleSubmit();
      }
      function goPrevious() {
        if (step > 1) {
          autoSaveDraft(step - 1);
          setStep(step - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
      function goSkip() {
        if (step < 6) { setStep(step + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      }
      function jumpToStep(s) { autoSaveDraft(s); setStep(s); window.scrollTo({ top: 0, behavior: 'smooth' }); }

      function handleSubmit() {
        if (!mixingActive && !dryingActive) { showToast('Tidak boleh kedua bagian non-aktif', 'error'); return; }
        if (mixingActive && !flourValid) {
          showToast(`Total tepung tidak sesuai (selisih ${flourDiff.toFixed(2)} sak, max ±1)`, 'error');
          setStep(2); return;
        }
        if (dryingActive && meterEnd < meterStart) {
          showToast('Meter akhir tidak boleh < meter awal', 'error');
          setStep(3); return;
        }

        const reportData = buildReport();

        if (editMode === 'edit-request') {
          // Need approval flow
          setPendingSubmitReport(reportData);
          setShowReasonModal(true);
          return;
        }

        if (editMode === 'edit-direct') {
          // Direct edit - update report directly
          const updated = {
            ...editReport,
            ...reportData,
            lastEditedAt: new Date().toISOString(),
            lastEditedBy: currentUser.name,
          };
          const newData = {
            ...data,
            reports: data.reports.map(r => r.id === editReport.id ? updated : r),
            activityLog: [...(data.activityLog || []), {
              id: Date.now(), timestamp: new Date().toISOString(),
              userId: currentUser.id, userName: currentUser.name,
              action: 'edit_report_direct',
              target: `Laporan ${formatDate(reportData.date)} Shift ${reportData.shift}`,
              details: 'Edit langsung dalam window 1 jam'
            }]
          };
          setData(newData);
          setShowSuccess({ report: updated, mode: 'edit-direct' });
          return;
        }

        // CREATE mode
        const newReport = {
          ...reportData, id: Date.now(),
          status: 'final', submittedAt: new Date().toISOString(),
        };
        let newDrafts = data.drafts || [];
        if (draftId) newDrafts = newDrafts.filter(d => d.id !== draftId);
        const newData = {
          ...data,
          reports: [...data.reports, newReport],
          drafts: newDrafts,
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'create_report',
            target: `Laporan ${formatDate(tanggal)} Shift ${shift}`,
            details: ''
          }]
        };
        setData(newData);
        setShowSuccess({ report: newReport, mode: 'create' });
      }

      function handleSubmitEditRequest(reason) {
        const editReq = {
          id: Date.now(),
          reportId: editReport.id,
          requesterId: currentUser.id,
          requesterName: currentUser.name,
          reason,
          proposedData: pendingSubmitReport,
          originalSnapshot: { ...editReport },
          status: 'pending',
          createdAt: new Date().toISOString(),
        };
        const newData = {
          ...data,
          editRequests: [...(data.editRequests || []), editReq],
          activityLog: [...(data.activityLog || []), {
            id: Date.now() + 1, timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'submit_edit_request',
            target: `Laporan ${formatDate(editReport.date)} Shift ${editReport.shift}`,
            details: `Alasan: ${reason}`
          }]
        };
        setData(newData);
        setShowReasonModal(false);
        setShowSuccess({ report: editReport, mode: 'edit-request' });
      }

      const downtimeCategories = ['Kerusakan Listrik', 'Kerusakan Mesin', 'Maintenance Terjadwal', 'Pergantian Produk', 'Cleaning Produk', 'Lainnya'];

      const headerTitle = isEditing
        ? (editMode === 'edit-direct' ? 'Edit Laporan' : 'Ajukan Edit Laporan')
        : 'Buat Laporan Produksi';
      const submitLabel = isEditing
        ? (editMode === 'edit-direct' ? 'Simpan Perubahan ✓' : 'Ajukan Edit')
        : 'Submit Laporan ✓';

      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream, paddingBottom: 0 }}>
          <PageHeader
            title={headerTitle}
            subtitle={shiftLabel(shift)}
            onBack={() => onNavigate('dashboard')}
            dark={true}
          />

          {editMode === 'edit-request' && (
            <div style={{
              background: COLORS.warningLight, padding: '10px 16px',
              borderBottom: `1px solid ${COLORS.warning}30`,
              fontSize: 11, color: COLORS.brown, display: 'flex', alignItems: 'center', gap: 8
            }}>
              <Icon name="info" size={14} color={COLORS.warning} />
              <span>Edit ini akan dikirim ke supervisor untuk approval (laporan sudah > 1 jam)</span>
            </div>
          )}

          <WizardStepper currentStep={step} totalSteps={6} onStepClick={jumpToStep} />

          <div style={{ padding: '14px 14px 100px' }}>
            {step === 1 && (
              <Step1InfoDasar
                tanggal={tanggal} setTanggal={setTanggal}
                shift={shift} setShift={setShift}
                mixingActive={mixingActive} setMixingActive={setMixingActive}
                dryingActive={dryingActive} setDryingActive={setDryingActive}
              />
            )}
            {step === 2 && (
              <Step2MixingTepung
                mixingActive={mixingActive} mixing={mixing}
                addMixingMachine={addMixingMachine} updateMixingMachine={updateMixingMachine} removeMixingMachine={removeMixingMachine}
                addMixingProduct={addMixingProduct} updateMixingProduct={updateMixingProduct} removeMixingProduct={removeMixingProduct}
                addMixingPlanning={addMixingPlanning} updateMixingPlanning={updateMixingPlanning} removeMixingPlanning={removeMixingPlanning}
                flour={flour} addFlour={addFlour} updateFlour={updateFlour} removeFlour={removeFlour}
                ragi={ragi} setRagi={setRagi}
                productOptions={productOptions} mixerOptions={mixerOptions} flourOptions={flourOptions}
                targetTepung={targetTepung} totalFlourInput={totalFlourInput} flourDiff={flourDiff} flourValid={flourValid}
              />
            )}
            {step === 3 && (
              <Step3DryingGas
                dryingActive={dryingActive} drying={drying}
                addDryingMachine={addDryingMachine} updateDryingMachine={updateDryingMachine} removeDryingMachine={removeDryingMachine}
                addDryingProduct={addDryingProduct} updateDryingProduct={updateDryingProduct} removeDryingProduct={removeDryingProduct}
                addDryingPlanning={addDryingPlanning} updateDryingPlanning={updateDryingPlanning} removeDryingPlanning={removeDryingPlanning}
                productOptions={productOptions} dryerOptions={dryerOptions}
                meterStart={meterStart} setMeterStart={setMeterStart}
                meterEnd={meterEnd} setMeterEnd={setMeterEnd}
                gasNote={gasNote} setGasNote={setGasNote}
                gasSelisihM3={gasSelisihM3} gasSm3={gasSm3} gasBiaya={gasBiaya}
                isEditing={isEditing}
              />
            )}
            {step === 4 && <Step4Workforce workforce={workforce} setWorkforce={setWorkforce} operatorOptions={operatorOptions} />}
            {step === 5 && (
              <Step5Downtime
                downtime={downtime} addDowntime={addDowntime} updateDowntime={updateDowntime} removeDowntime={removeDowntime}
                downtimeCategories={downtimeCategories}
                mixerOptions={mixerOptions} dryerOptions={dryerOptions}
                generalNote={generalNote} setGeneralNote={setGeneralNote}
              />
            )}
            {step === 6 && <Step6Review report={buildReport()} currentUser={currentUser} onJumpToStep={jumpToStep} />}
          </div>

          <WizardNavigation
            currentStep={step} totalSteps={6}
            onPrevious={goPrevious} onNext={goNext} onSkip={goSkip}
            onSaveDraft={isEditing ? null : handleSaveDraft}
            nextLabel={step === 6 ? submitLabel : 'Selanjutnya'}
            allowSkip={step !== 6}
          />

          {showDraftModal && (
            <DraftSelectionModal
              drafts={(data.drafts || []).filter(d => d.leaderId === currentUser.id)}
              onLoadDraft={(d) => { onNavigate('input-laporan', { draft: d }); setShowDraftModal(false); }}
              onNewReport={() => setShowDraftModal(false)}
              onDeleteDraft={(id) => {
                setData({ ...data, drafts: (data.drafts || []).filter(d => d.id !== id) });
                showToast('Draft dihapus', 'success');
              }}
              onClose={() => setShowDraftModal(false)}
            />
          )}

          {showReasonModal && (
            <EditRequestReasonModal
              onSubmit={handleSubmitEditRequest}
              onClose={() => { setShowReasonModal(false); setPendingSubmitReport(null); }}
            />
          )}

          {showSuccess && (
            <SubmitSuccessModal
              report={showSuccess.report} mode={showSuccess.mode}
              onClose={() => { setShowSuccess(null); onNavigate('dashboard'); }}
              onDownloadPDF={() => {
                onNavigate('laporan-detail', { report: showSuccess.report, autoPrint: true });
                setShowSuccess(null);
              }}
              onDownloadJPEG={() => {
                onNavigate('laporan-detail', { report: showSuccess.report, autoJpeg: true });
                setShowSuccess(null);
              }}
              onViewReport={() => {
                onNavigate('laporan-detail', { report: showSuccess.report });
                setShowSuccess(null);
              }}
              onNewReport={() => { setShowSuccess(null); onNavigate('dashboard'); setTimeout(() => onNavigate('input-laporan'), 100); }}
            />
          )}
        </div>
      );
    }
    // ============================================================
    // STEP 1: INFO DASAR
    // ============================================================
    function Step1InfoDasar({ tanggal, setTanggal, shift, setShift, mixingActive, setMixingActive, dryingActive, setDryingActive }) {
      return (
        <div className="gfl-fade-in">
          <div className="gfl-card" style={{ marginBottom: 12 }}>
            <h3 style={{ fontSize: 16, fontWeight: 800, color: COLORS.brown, marginBottom: 4, letterSpacing: -0.3 }}>
              📅 Informasi Dasar
            </h3>
            <p style={{ fontSize: 12, color: COLORS.textMuted, marginBottom: 14 }}>Tentukan tanggal & shift laporan ini</p>

            <div style={{ marginBottom: 12 }}>
              <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 6, display: 'block', textTransform: 'uppercase', letterSpacing: 0.5 }}>Tanggal Laporan</label>
              <input type="date" value={tanggal} onChange={e => setTanggal(e.target.value)} className="gfl-input" />
            </div>

            <div>
              <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 6, display: 'block', textTransform: 'uppercase', letterSpacing: 0.5 }}>Shift</label>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
                {[1, 2, 3].map(s => (
                  <button key={s} onClick={() => setShift(s)} style={{
                    padding: '12px 6px', borderRadius: 14,
                    background: shift === s ? `linear-gradient(135deg, ${COLORS.gold}, ${COLORS.goldLight})` : COLORS.creamLight,
                    color: shift === s ? '#fff' : COLORS.brown,
                    border: 'none', cursor: 'pointer',
                    fontSize: 13, fontWeight: 700,
                    boxShadow: shift === s ? '0 4px 12px rgba(184,134,11,0.3)' : 'none',
                  }}>
                    <div>Shift {s}</div>
                    <div style={{ fontSize: 9, fontWeight: 500, marginTop: 2, opacity: 0.85 }}>
                      {s === 1 ? '23:30-07:30' : s === 2 ? '07:30-15:30' : '15:30-23:30'}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="gfl-card">
            <h3 style={{ fontSize: 14, fontWeight: 800, color: COLORS.brown, marginBottom: 4 }}>⚙️ Bagian Aktif</h3>
            <p style={{ fontSize: 12, color: COLORS.textMuted, marginBottom: 14 }}>Pilih bagian produksi yang berjalan di shift ini</p>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <label style={{
                padding: 14, background: mixingActive ? COLORS.successLight : COLORS.creamLight,
                border: `1.5px solid ${mixingActive ? COLORS.success + '40' : COLORS.border}`,
                borderRadius: 14, cursor: 'pointer',
                display: 'flex', alignItems: 'center', gap: 10
              }}>
                <input type="checkbox" checked={mixingActive} onChange={e => setMixingActive(e.target.checked)} style={{ width: 18, height: 18, accentColor: COLORS.success }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.brown }}>🧪 Mixing</div>
                  <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 2 }}>Pencampuran bahan baku jadi adonan</div>
                </div>
                <Badge color={mixingActive ? COLORS.success : COLORS.textMuted}>{mixingActive ? 'Aktif' : 'Off'}</Badge>
              </label>

              <label style={{
                padding: 14, background: dryingActive ? COLORS.successLight : COLORS.creamLight,
                border: `1.5px solid ${dryingActive ? COLORS.success + '40' : COLORS.border}`,
                borderRadius: 14, cursor: 'pointer',
                display: 'flex', alignItems: 'center', gap: 10
              }}>
                <input type="checkbox" checked={dryingActive} onChange={e => setDryingActive(e.target.checked)} style={{ width: 18, height: 18, accentColor: COLORS.success }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.brown }}>🔥 Drying</div>
                  <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 2 }}>Pengeringan adonan menjadi tepung roti</div>
                </div>
                <Badge color={dryingActive ? COLORS.success : COLORS.textMuted}>{dryingActive ? 'Aktif' : 'Off'}</Badge>
              </label>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // STEP 2: MIXING + BAHAN BAKU (NEW STRUCTURE)
    // ============================================================
    function Step2MixingTepung({ mixingActive, mixing,
      addMixingMachine, updateMixingMachine, removeMixingMachine,
      addMixingProduct, updateMixingProduct, removeMixingProduct,
      addMixingPlanning, updateMixingPlanning, removeMixingPlanning,
      flour, addFlour, updateFlour, removeFlour, ragi, setRagi,
      productOptions, mixerOptions, flourOptions,
      targetTepung, totalFlourInput, flourDiff, flourValid }) {

      if (!mixingActive) {
        return (
          <div className="gfl-fade-in">
            <EmptyState icon="info" title="Mixing Tidak Aktif" message="Bagian Mixing dimatikan di Step 1." />
          </div>
        );
      }

      return (
        <div className="gfl-fade-in">
          <div className="gfl-card" style={{ marginBottom: 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
              <h3 style={{ fontSize: 16, fontWeight: 800, color: COLORS.brown, letterSpacing: -0.3 }}>🧪 Mixing</h3>
            </div>
            <p style={{ fontSize: 12, color: COLORS.textMuted, marginBottom: 14 }}>
              Tiap mesin bisa berisi banyak produk, tiap produk bisa banyak planning
            </p>

            {mixing.map((m, mIdx) => (
              <div key={m.id} style={{
                background: COLORS.creamLight, padding: 12, borderRadius: 14, marginBottom: 10,
                border: `1.5px solid ${COLORS.border}`
              }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 800, color: COLORS.brown, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                    🏭 Mesin #{mIdx + 1}
                  </span>
                  {mixing.length > 1 && (
                    <button onClick={() => removeMixingMachine(mIdx)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: COLORS.danger, padding: 4 }}>
                      <Icon name="trash" size={14} />
                    </button>
                  )}
                </div>
                <div style={{ marginBottom: 8 }}>
                  <label style={{ fontSize: 10, color: COLORS.textMuted, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4 }}>Jenis Mesin</label>
                  <SearchableSelect value={m.machineName} onChange={v => updateMixingMachine(mIdx, 'machineName', v)} options={mixerOptions} placeholder="Pilih mesin" />
                </div>

                {/* Products inside this machine */}
                {(m.products || []).map((prod, pIdx) => (
                  <div key={prod.id} style={{
                    background: '#fff', padding: 10, borderRadius: 12, marginBottom: 8,
                    border: `1px dashed ${COLORS.border}`
                  }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span style={{ fontSize: 10, fontWeight: 700, color: COLORS.gold, textTransform: 'uppercase', letterSpacing: 0.4 }}>
                        📦 Produk #{pIdx + 1}
                      </span>
                      {m.products.length > 1 && (
                        <button onClick={() => removeMixingProduct(mIdx, pIdx)} style={{
                          background: COLORS.dangerLight, border: 'none', borderRadius: 999,
                          padding: '3px 8px', cursor: 'pointer', color: COLORS.danger, fontSize: 10, fontWeight: 700,
                          display: 'inline-flex', alignItems: 'center', gap: 3
                        }}>
                          <Icon name="x" size={10} /> Hapus
                        </button>
                      )}
                    </div>
                    <div style={{ marginBottom: 8 }}>
                      <SearchableSelect value={prod.productName} onChange={v => updateMixingProduct(mIdx, pIdx, 'productName', v)} options={productOptions} placeholder="Pilih produk" />
                    </div>
                    <div>
                      <label style={{ fontSize: 10, color: COLORS.textMuted, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4, display: 'block', marginBottom: 4 }}>
                        No. Planning & Batch
                      </label>
                      {(prod.plannings || []).map((p, plIdx) => (
                        <div key={p.id} style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
                          <StableTextInput value={p.noPlanning} onChange={v => updateMixingPlanning(mIdx, pIdx, plIdx, 'noPlanning', v)} placeholder="P.04158" style={{ flex: 1.5 }} />
                          <StableNumberInput value={p.batches} onChange={v => updateMixingPlanning(mIdx, pIdx, plIdx, 'batches', v)} placeholder="Batch" style={{ flex: 1 }} />
                          {prod.plannings.length > 1 && (
                            <button onClick={() => removeMixingPlanning(mIdx, pIdx, plIdx)} style={{
                              background: COLORS.dangerLight, border: 'none', borderRadius: 12,
                              padding: '0 10px', cursor: 'pointer', color: COLORS.danger
                            }}>
                              <Icon name="x" size={12} />
                            </button>
                          )}
                        </div>
                      ))}
                      {/* Add Planning + Add Product buttons - both NEAR the input area */}
                      <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                        <button onClick={() => addMixingPlanning(mIdx, pIdx)} style={{
                          background: COLORS.goldPale, border: `1px solid ${COLORS.gold}40`, borderRadius: 999,
                          padding: '6px 12px', cursor: 'pointer', color: COLORS.gold, fontSize: 11, fontWeight: 700,

    // ============================================================
    // MONITORING PAGE - with edit/edit-request based on getEditStatus
    // ============================================================
    function MonitoringPage({ currentUser, onNavigate, data, setData, showToast }) {
      const [filter, setFilter] = React.useState({ search: '', shift: '', leader: '', from: '', to: '' });
      const [showFilter, setShowFilter] = React.useState(false);
      const [deleteModal, setDeleteModal] = React.useState(null);

      const filtered = React.useMemo(() => {
        return data.reports.filter(r => {
          if (filter.search) {
            const q = filter.search.toLowerCase();
            if (!r.leaderName.toLowerCase().includes(q) &&
                !formatDateShort(r.date).includes(q) &&
                !shiftLabel(r.shift).toLowerCase().includes(q)) return false;
          }
          if (filter.shift && r.shift !== parseInt(filter.shift, 10)) return false;
          if (filter.leader && r.leaderId !== parseInt(filter.leader, 10)) return false;
          if (filter.from && r.date < filter.from) return false;
          if (filter.to && r.date > filter.to) return false;
          return true;
        }).sort((a, b) => new Date(b.submittedAt || b.date) - new Date(a.submittedAt || a.date));
      }, [data.reports, filter]);

      const leaders = data.users.filter(u => u.role === 'Team Leader' || u.role === 'Supervisor');
      const isAdmin = currentUser.role === 'Admin';
      const canEditReports = currentUser.role === 'Team Leader' || isAdmin;

      function handleEditClick(r) {
        const status = getEditStatus(r);
        if (isAdmin) {
          // Admin always direct edit
          onNavigate('input-laporan', { editReport: r, editMode: 'edit-direct' });
          return;
        }
        if (status.canEdit) {
          onNavigate('input-laporan', { editReport: r, editMode: 'edit-direct' });
        } else {
          // Need approval flow
          onNavigate('input-laporan', { editReport: r, editMode: 'edit-request' });
        }
      }

      function handleDelete() {
        if (!deleteModal) return;
        const r = deleteModal;
        const newData = {
          ...data,
          reports: data.reports.filter(rep => rep.id !== r.id),
          deletedReports: [...(data.deletedReports || []), { ...r, deletedAt: new Date().toISOString(), deletedBy: currentUser.name }],
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'delete_report',
            target: `Laporan ${formatDate(r.date)} Shift ${r.shift}`,
            details: ''
          }]
        };
        setData(newData);
        setDeleteModal(null);
        showToast('Laporan dihapus (masuk arsip)', 'success');
      }

      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream, paddingBottom: 80 }}>
          <PageHeader
            title="Monitoring Laporan"
            subtitle={`${filtered.length} laporan`}
            onBack={() => onNavigate('dashboard')}
            action={
              <button onClick={() => setShowFilter(!showFilter)} style={{
                background: showFilter ? COLORS.gold : '#fff', border: `1px solid ${COLORS.border}`,
                borderRadius: 12, padding: 10, cursor: 'pointer'
              }}>
                <Icon name="filter" size={16} color={showFilter ? '#fff' : COLORS.brown} />
              </button>
            }
          />

          <div style={{ padding: 14 }}>
            <div style={{ position: 'relative', marginBottom: 12 }}>
              <Icon name="search" size={16} color={COLORS.textMuted} />
              <input
                type="text" value={filter.search} onChange={e => setFilter({ ...filter, search: e.target.value })}
                placeholder="Cari leader, tanggal..."
                className="gfl-input" style={{ paddingLeft: 38 }}
              />
              <div style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)' }}>
                <Icon name="search" size={16} color={COLORS.textMuted} />
              </div>
            </div>

            {showFilter && (
              <div className="gfl-card gfl-fade-in" style={{ marginBottom: 12 }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 8 }}>
                  <div>
                    <label style={{ fontSize: 10, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Dari</label>
                    <input type="date" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} className="gfl-input" />
                  </div>
                  <div>
                    <label style={{ fontSize: 10, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Sampai</label>
                    <input type="date" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} className="gfl-input" />
                  </div>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                  <select value={filter.shift} onChange={e => setFilter({ ...filter, shift: e.target.value })} className="gfl-input">
                    <option value="">Semua Shift</option>
                    <option value="1">Shift 1</option><option value="2">Shift 2</option><option value="3">Shift 3</option>
                  </select>
                  <select value={filter.leader} onChange={e => setFilter({ ...filter, leader: e.target.value })} className="gfl-input">
                    <option value="">Semua Leader</option>
                    {leaders.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                </div>
                <button onClick={() => setFilter({ search: '', shift: '', leader: '', from: '', to: '' })} style={{
                  background: 'none', border: 'none', color: COLORS.gold, fontSize: 12, fontWeight: 600, cursor: 'pointer', marginTop: 10
                }}>
                  Reset Filter
                </button>
              </div>
            )}

            {filtered.length === 0 ? (
              <EmptyState icon="info" title="Tidak ada laporan" message="Coba ubah filter atau buat laporan baru." />
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {filtered.map(r => {
                  const totals = calcReportTotals(r);
                  const editStatus = getEditStatus(r);
                  const showEditBtn = canEditReports;

                  return (
                    <div key={r.id} className="gfl-card" style={{ padding: 14 }}>
                      <div onClick={() => onNavigate('laporan-detail', { report: r })} style={{ cursor: 'pointer' }}>
                        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 8 }}>
                          <div>
                            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.brown }}>{formatDate(r.date)}</div>
                            <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 2 }}>
                              Shift {r.shift} · {r.leaderName}
                            </div>
                          </div>
                          <Badge color={editStatus.color}>
                            {editStatus.canEdit ? <Icon name="edit" size={9} color={editStatus.color} /> : <Icon name="lock" size={9} color={editStatus.color} />}
                            {editStatus.label}
                          </Badge>
                        </div>
                        <div style={{ display: 'flex', gap: 14, fontSize: 11, marginBottom: 8 }}>
                          <div><span style={{ color: COLORS.textMuted }}>Batch </span><strong style={{ color: COLORS.brown }}>{totals.totalBatch}</strong></div>
                          <div><span style={{ color: COLORS.textMuted }}>Sak </span><strong style={{ color: COLORS.brown }}>{totals.totalSak}</strong></div>
                          <div><span style={{ color: COLORS.textMuted }}>Gas </span><strong style={{ color: COLORS.brown }}>{formatNumber(r.gas?.sm3 || 0, 1)}</strong></div>
                        </div>
                      </div>
                      {showEditBtn && (
                        <div style={{ display: 'flex', gap: 6, paddingTop: 8, borderTop: `1px solid ${COLORS.borderLight}` }}>
                          <button onClick={(e) => { e.stopPropagation(); handleEditClick(r); }} style={{
                            flex: 1, padding: '8px', borderRadius: 10,
                            background: editStatus.canEdit || isAdmin ? COLORS.successLight : COLORS.warningLight,
                            color: editStatus.canEdit || isAdmin ? COLORS.success : COLORS.warning,
                            border: 'none', cursor: 'pointer', fontSize: 11, fontWeight: 700,
                            display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 4
                          }}>
                            {editStatus.canEdit || isAdmin ? <><Icon name="edit" size={11} /> Edit</> : <><Icon name="send" size={11} /> Ajukan Edit</>}
                          </button>
                          {isAdmin && (
                            <button onClick={(e) => { e.stopPropagation(); setDeleteModal(r); }} style={{
                              padding: '8px 12px', borderRadius: 10,
                              background: COLORS.dangerLight, color: COLORS.danger,
                              border: 'none', cursor: 'pointer'
                            }}>
                              <Icon name="trash" size={11} color={COLORS.danger} />
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {deleteModal && (
            <Modal open={true} onClose={() => setDeleteModal(null)} title="🗑️ Hapus Laporan?" maxWidth={360}>
              <div style={{ padding: 12, background: COLORS.dangerLight, borderRadius: 12, marginBottom: 14 }}>
                <div style={{ fontSize: 12, color: COLORS.danger, fontWeight: 700, marginBottom: 4 }}>⚠️ Konfirmasi</div>
                <div style={{ fontSize: 11, color: COLORS.text, lineHeight: 1.5 }}>
                  Laporan <strong>{formatDate(deleteModal.date)} Shift {deleteModal.shift}</strong> akan dihapus.
                  Data tidak hilang permanen — bisa direstore dari arsip.
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => setDeleteModal(null)} className="gfl-btn gfl-btn-secondary" style={{ flex: 1 }}>Batal</button>
                <button onClick={handleDelete} className="gfl-btn gfl-btn-danger" style={{ flex: 1 }}>
                  <Icon name="trash" size={14} color="#fff" /> Hapus
                </button>
              </div>
            </Modal>
          )}
        </div>
      );
    }
    // ============================================================
    // LAPORAN DETAIL PAGE - with JPEG fix
    // ============================================================
    function LaporanDetailPage({ report, currentUser, onNavigate, data, setData, showToast, autoPrint, autoJpeg }) {
      const totals = calcReportTotals(report);
      const editStatus = getEditStatus(report);
      const isAdmin = currentUser.role === 'Admin';
      const canEditReports = currentUser.role === 'Team Leader' || isAdmin;

      const [generating, setGenerating] = React.useState(false);

      React.useEffect(() => {
        if (autoPrint) setTimeout(() => handlePrint(), 500);
        if (autoJpeg) setTimeout(() => handleDownloadJPEG(), 500);
      }, [autoPrint, autoJpeg]);

      function handlePrint() {
        window.print();
      }

      async function handleDownloadJPEG() {
        if (typeof html2canvas === 'undefined') { showToast('Loading library...', 'info'); return; }
        setGenerating(true);
        try {
          const el = document.getElementById('jpeg-render-target');
          if (!el) { setGenerating(false); return; }
          const canvas = await html2canvas(el, {
            scale: 2, backgroundColor: '#FFFFFF',
            useCORS: true, allowTaint: true, logging: false,
            width: el.offsetWidth, height: el.offsetHeight
          });
          canvas.toBlob(blob => {
            downloadFile(blob, `Laporan_${report.date}_Shift${report.shift}.jpg`);
            setGenerating(false);
            showToast('JPEG berhasil diunduh', 'success');
          }, 'image/jpeg', 0.92);
        } catch (e) {
          console.error(e);
          showToast('Gagal generate JPEG', 'error');
          setGenerating(false);
        }
      }

      function handleEditClick() {
        if (isAdmin) {
          onNavigate('input-laporan', { editReport: report, editMode: 'edit-direct' });
          return;
        }
        if (editStatus.canEdit) {
          onNavigate('input-laporan', { editReport: report, editMode: 'edit-direct' });
        } else {
          onNavigate('input-laporan', { editReport: report, editMode: 'edit-request' });
        }
      }

      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream, paddingBottom: 80 }}>
          <div className="no-print">
            <PageHeader
              title="Detail Laporan"
              subtitle={`${formatDate(report.date)} · Shift ${report.shift}`}
              onBack={() => onNavigate('monitoring')}
              dark
            />
          </div>

          <div className="no-print" style={{ padding: 14 }}>
            {/* Edit status banner */}
            <div style={{
              padding: 12, borderRadius: 14, marginBottom: 14,
              background: editStatus.canEdit ? COLORS.successLight : COLORS.warningLight,
              border: `1px solid ${editStatus.color}30`,
              display: 'flex', alignItems: 'center', gap: 10
            }}>
              <Icon name={editStatus.canEdit ? 'edit' : 'lock'} size={16} color={editStatus.color} />
              <div style={{ flex: 1, fontSize: 11, color: COLORS.text }}>
                <strong style={{ color: editStatus.color }}>{editStatus.label}</strong>
                <div style={{ fontSize: 10, color: COLORS.textMuted, marginTop: 2 }}>
                  {editStatus.canEdit
                    ? 'Edit langsung berlaku tanpa approval'
                    : 'Edit harus melalui pengajuan ke supervisor'}
                </div>
              </div>
            </div>

            {/* Action buttons */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8, marginBottom: 14 }}>
              <button onClick={handlePrint} className="gfl-btn gfl-btn-primary" style={{ padding: 12 }}>
                <Icon name="printer" size={14} color="#fff" /> Print PDF
              </button>
              <button onClick={handleDownloadJPEG} className="gfl-btn gfl-btn-secondary" style={{ padding: 12 }} disabled={generating}>
                <Icon name="image" size={14} /> {generating ? 'Loading...' : 'JPEG'}
              </button>
              {canEditReports && (
                <button onClick={handleEditClick} className="gfl-btn" style={{
                  padding: 12, gridColumn: 'span 2',
                  background: editStatus.canEdit || isAdmin ? COLORS.successLight : COLORS.warningLight,
                  color: editStatus.canEdit || isAdmin ? COLORS.success : COLORS.warning,
                  border: `1px solid ${(editStatus.canEdit || isAdmin) ? COLORS.success : COLORS.warning}40`
                }}>
                  {editStatus.canEdit || isAdmin
                    ? <><Icon name="edit" size={14} color={COLORS.success} /> Edit Laporan Langsung</>
                    : <><Icon name="send" size={14} color={COLORS.warning} /> Ajukan Edit ke Supervisor</>
                  }
                </button>
              )}
            </div>
          </div>

          {/* PRINTABLE / SHAREABLE CONTENT */}
          <div style={{ padding: '0 14px' }}>
            <div id="jpeg-render-target" className="gfl-card" style={{
              padding: 20, background: '#fff', borderRadius: 16,
              boxShadow: '0 2px 8px rgba(92,51,23,0.06)'
            }}>
              {/* Single header - removed double kop */}
              <div style={{
                display: 'flex', alignItems: 'center', gap: 12,
                borderBottom: `2px solid ${COLORS.brown}`, paddingBottom: 12, marginBottom: 14
              }}>
                <img src={LOGO_URL} alt="GFL" style={{ width: 50, height: 50, borderRadius: '50%' }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, fontWeight: 800, color: COLORS.brown, letterSpacing: -0.3 }}>{COMPANY_INFO.name}</div>
                  <div style={{ fontSize: 9, color: COLORS.textMuted, lineHeight: 1.3 }}>{COMPANY_INFO.address}</div>
                </div>
              </div>

              <div style={{ textAlign: 'center', marginBottom: 14 }}>
                <h2 style={{ fontSize: 16, fontWeight: 800, color: COLORS.brown, letterSpacing: 0.5 }}>LAPORAN PRODUKSI</h2>
                <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 2 }}>
                  {formatDate(report.date)} · {shiftLabel(report.shift)}
                </div>
              </div>

              <div style={{ marginBottom: 14, padding: 12, background: COLORS.creamLight, borderRadius: 10 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, marginBottom: 4 }}>
                  <span style={{ color: COLORS.textMuted }}>Leader:</span>
                  <strong style={{ color: COLORS.brown }}>{report.leaderName}</strong>
