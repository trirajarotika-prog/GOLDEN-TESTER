<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Golden Food Production — CV Golden Food Lestari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%; width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F5EFE2;
      color: #2C1A0E;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body { overflow-x: hidden; }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4B896; border-radius: 4px; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    * { -webkit-tap-highlight-color: transparent; }

    .gfl-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #E8DCC4;
      border-radius: 12px; font-size: 14px; background: #fff;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: #2C1A0E;
    }
    .gfl-input:focus {
      outline: none; border-color: #B8860B;
      box-shadow: 0 0 0 4px rgba(184,134,11,0.10);
    }
    .gfl-input:disabled {
      background: #F5EFE2; color: #7A6248;
    }

    .gfl-btn {
      padding: 12px 20px; border: none; border-radius: 999px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.2px;
    }
    .gfl-btn-primary {
      background: linear-gradient(135deg, #B8860B 0%, #DAA520 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(184,134,11,0.35);
    }
    .gfl-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(184,134,11,0.45); }
    .gfl-btn-primary:active { transform: translateY(0); }
    .gfl-btn-secondary {
      background: #fff; color: #5C3317; border: 1.5px solid #E8DCC4;
    }
    .gfl-btn-secondary:hover { border-color: #B8860B; color: #B8860B; }
    .gfl-btn-danger {
      background: #C0392B; color: #fff;
      box-shadow: 0 4px 14px rgba(192,57,43,0.3);
    }
    .gfl-btn-ghost { background: transparent; color: #5C3317; }
    .gfl-btn-ghost:hover { background: rgba(184,134,11,0.08); }

    .gfl-card {
      background: #fff; border-radius: 20px; padding: 18px;
      box-shadow: 0 2px 8px rgba(92,51,23,0.04), 0 1px 2px rgba(92,51,23,0.06);
      border: 1px solid rgba(232,220,196,0.6);
      transition: box-shadow 0.2s;
    }
    .gfl-card-hover:hover { box-shadow: 0 8px 24px rgba(92,51,23,0.10), 0 2px 4px rgba(92,51,23,0.06); }
    .gfl-glass {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .gfl-fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .gfl-slide-up { animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media print {
      body, html, #root { background: #fff !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .gfl-card {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        page-break-inside: avoid;
      }
      @page { size: A4 portrait; margin: 12mm 14mm; }
      #root { max-width: 100% !important; box-shadow: none !important; }
    }
    .print-only { display: none; }

    @media (min-width: 480px) {
      #root {
        max-width: 430px; margin: 0 auto;
        box-shadow: 0 0 60px rgba(0,0,0,0.12);
        min-height: 100vh; background: #F5EFE2;
      }
    }
  </style>

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;

      if (!dateStr) return '-';

      return d.toLocaleDateString('id-ID');
    }
    function formatRupiah(num) {
      return 'Rp ' + Math.round(num || 0).toLocaleString('id-ID');
    }
    function formatNumber(num, decimals = 0) {
      if (num === null || num === undefined) return '-';
      return Number(num).toLocaleString('id-ID', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }
    function calcGasSm3(meterStart, meterEnd, gasConfig) {
      const A = meterEnd - meterStart;
      const B = (gasConfig.pressureOut + 1.01325) / 1.01325;
      const C = 300 / (gasConfig.temperature + 273);
      const D = 1.002;
      return A * B * C * D;
    }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    /**
     * StableNumberInput - PERBAIKAN BUG: Input angka yang tidak kehilangan fokus.
     * Pakai local state + ref tracking untuk mencegah re-render saat ngetik.
     */
    function StableNumberInput({ value, onChange, placeholder, allowDecimal = false, style = {}, disabled = false }) {
      const [local, setLocal] = React.useState(value === 0 || value === null || value === undefined ? '' : String(value));
      const lastValueRef = React.useRef(value);
      React.useEffect(() => {
        if (value !== lastValueRef.current) {
          setLocal(value === 0 || value === null || value === undefined ? '' : String(value));
          lastValueRef.current = value;
        }
      }, [value]);
      function handleChange(e) {
        const v = e.target.value;
        const regex = allowDecimal ? /^\d*\.?\d*$/ : /^\d*$/;
        if (v === '' || regex.test(v)) {
          setLocal(v);
          const num = v === '' ? 0 : (allowDecimal ? parseFloat(v) : parseInt(v, 10));
          if (!isNaN(num)) {
            lastValueRef.current = num;
            onChange(num);
          } else if (v === '') {
            lastValueRef.current = 0;
            onChange(0);
          }
        }
      }
      function handleBlur() {
        if (local === '' || local === '.') {
          setLocal(''); lastValueRef.current = 0; onChange(0);
        }
      }
      return (
        <input
          type="text" inputMode={allowDecimal ? "decimal" : "numeric"}
          pattern={allowDecimal ? "[0-9]*\\.?[0-9]*" : "[0-9]*"}
          value={local} onChange={handleChange} onBlur={handleBlur}
          placeholder={placeholder} className="gfl-input" style={style}
          disabled={disabled}
        />
      );
    }
    function StableTextInput({ value, onChange, placeholder, style = {}, disabled = false }) {
      const [local, setLocal] = React.useState(value || '');
      const lastValueRef = React.useRef(value);
      React.useEffect(() => {
        if (value !== lastValueRef.current) {
          setLocal(value || ''); lastValueRef.current = value;
        }
      }, [value]);
      function handleChange(e) {
        const v = e.target.value;
        setLocal(v); lastValueRef.current = v; onChange(v);
      }
      return <input type="text" value={local} onChange={handleChange} placeholder={placeholder} className="gfl-input" style={style} disabled={disabled} />;
    }
    function StableTextarea({ value, onChange, placeholder, rows = 2, style = {} }) {
      const [local, setLocal] = React.useState(value || '');
      const lastValueRef = React.useRef(value);
      React.useEffect(() => {
        if (value !== lastValueRef.current) { setLocal(value || ''); lastValueRef.current = value; }
      }, [value]);
      function handleChange(e) {
        const v = e.target.value;
        setLocal(v); lastValueRef.current = v; onChange(v);
      }
      return <textarea value={local} onChange={handleChange} placeholder={placeholder} rows={rows} className="gfl-input" style={{ resize: 'vertical', minHeight: 60, ...style }} />;
    }

    function SearchableSelect({ value, onChange, options, placeholder = 'Pilih...', disabled = false, multiple = false, allowEmpty = false }) {
      const [open, setOpen] = React.useState(false);
      const [search, setSearch] = React.useState('');
      const ref = React.useRef(null);
      const searchRef = React.useRef(null);

      React.useEffect(() => {
        function handleClick(e) {
          if (ref.current && !ref.current.contains(e.target)) {
            setOpen(false); setSearch('');
          }
        }
        if (open) document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, [open]);

      React.useEffect(() => {
        if (open && searchRef.current) {
          setTimeout(() => searchRef.current?.focus(), 50);
        }
      }, [open]);

      const filtered = options.filter(opt => {
        const label = typeof opt === 'string' ? opt : opt.label || opt.name;
        return label.toLowerCase().includes(search.toLowerCase());
      });

      const getLabel = (val) => {
        if (val === null || val === undefined || val === '') return placeholder;
        if (multiple && Array.isArray(val)) {
          if (val.length === 0) return placeholder;
          return val.length === 1 ? val[0] : `${val[0]} +${val.length - 1} lainnya`;
        }
        return val;
      };

      return (
        <div ref={ref} style={{ position: 'relative', width: '100%' }}>
          <div onClick={() => !disabled && setOpen(!open)} className="gfl-input" style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            cursor: disabled ? 'not-allowed' : 'pointer',
            background: disabled ? COLORS.cream : '#fff',
            color: (multiple ? (Array.isArray(value) && value.length > 0) : value) ? COLORS.text : COLORS.textMuted,
          }}>
            <span style={{ fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{getLabel(value)}</span>
            <Icon name="chevronDown" size={16} color={COLORS.textMuted} />
          </div>
          {open && (
            <div className="gfl-fade-in" style={{
              position: 'absolute', top: '100%', left: 0, right: 0, marginTop: 6,
              background: '#fff', border: `1px solid ${COLORS.border}`, borderRadius: 14,
              boxShadow: '0 12px 32px rgba(92,51,23,0.15)', zIndex: 100, maxHeight: 280, overflow: 'hidden',
              display: 'flex', flexDirection: 'column'
            }}>
              <div style={{ padding: 8, borderBottom: `1px solid ${COLORS.borderLight}` }}>
                <input ref={searchRef} type="text" value={search} onChange={e => setSearch(e.target.value)}
                  placeholder="Cari..." className="gfl-input" style={{ fontSize: 13, padding: '8px 12px' }} />
              </div>
              <div style={{ overflow: 'auto', maxHeight: 220 }}>
                {allowEmpty && !multiple && (
                  <div onClick={() => { onChange(''); setOpen(false); setSearch(''); }} style={{
                    padding: '10px 14px', cursor: 'pointer', fontSize: 13, color: COLORS.textMuted, fontStyle: 'italic'
                  }}>(Kosongkan)</div>
                )}
                {filtered.length === 0 ? (
                  <div style={{ padding: 12, textAlign: 'center', color: COLORS.textMuted, fontSize: 13 }}>Tidak ada hasil</div>
                ) : filtered.map((opt, idx) => {
                  const label = typeof opt === 'string' ? opt : opt.label || opt.name;
                  const val = typeof opt === 'string' ? opt : opt.value || opt.name;
                  const isSelected = multiple ? Array.isArray(value) && value.includes(val) : value === val;
                  return (
                    <div key={idx} onClick={() => {
                      if (multiple) {
                        const newVal = Array.isArray(value) ? [...value] : [];
                        const i = newVal.indexOf(val);
                        if (i >= 0) newVal.splice(i, 1); else newVal.push(val);
                        onChange(newVal);
                      } else {
                        onChange(val); setOpen(false); setSearch('');
                      }
                    }} style={{
                      padding: '10px 14px', cursor: 'pointer', fontSize: 13,
                      background: isSelected ? COLORS.goldPale : 'transparent',
                      color: isSelected ? COLORS.brown : COLORS.text,
                      fontWeight: isSelected ? 600 : 400,
                      borderBottom: `1px solid ${COLORS.borderLight}`,
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between'
                    }}>
                      <span>{label}</span>
                      {isSelected && <Icon name="check" size={14} color={COLORS.gold} />}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

                Shift {report.shift} · {report.leaderName}
              </div>

          </div>
          <div style={{ display: 'flex', gap: 14, fontSize: 11 }}>
            <div><span style={{ color: COLORS.textMuted }}>Batch </span><strong style={{ color: COLORS.brown }}>{totalBatch}</strong></div>
            <div><span style={{ color: COLORS.textMuted }}>Sak </span><strong style={{ color: COLORS.brown }}>{totalSak}</strong></div>
            <div><span style={{ color: COLORS.textMuted }}>Gas </span><strong style={{ color: COLORS.brown }}>{formatNumber(report.gas?.sm3 || 0, 1)} Sm³</strong></div>
          </div>
        </div>
      );
    }
    // ============================================================
    // INPUT LAPORAN WIZARD - 6 Steps Premium
    // ============================================================

    // Step indicator dengan visual progress
    function WizardStepper({ currentStep, totalSteps, onStepClick, allowJump = true }) {
      return (
        <div style={{
          padding: '12px 16px', background: COLORS.white,
          borderBottom: `1px solid ${COLORS.borderLight}`,
          position: 'sticky', top: 0, zIndex: 10
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, textTransform: 'uppercase', letterSpacing: 0.5 }}>
              Langkah {currentStep} dari {totalSteps}
            </span>
            <span style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600 }}>
              {Math.round((currentStep / totalSteps) * 100)}% selesai
            </span>
          </div>
          {/* Progress bar */}
          <div style={{ height: 6, background: COLORS.creamDark, borderRadius: 999, overflow: 'hidden' }}>
            <div style={{
              height: '100%', width: `${(currentStep / totalSteps) * 100}%`,
              background: `linear-gradient(90deg, ${COLORS.gold}, ${COLORS.goldLight})`,
              borderRadius: 999, transition: 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1)'
            }} />
          </div>
          {/* Step dots */}
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 10, padding: '0 4px' }}>
            {Array.from({ length: totalSteps }, (_, i) => {
              const step = i + 1;
              const isActive = step === currentStep;
              const isDone = step < currentStep;
              return (
                <div key={step} onClick={() => allowJump && onStepClick && onStepClick(step)} style={{
                  width: 24, height: 24, borderRadius: '50%',
                  background: isDone ? COLORS.gold : isActive ? COLORS.gold : COLORS.creamDark,
                  color: (isDone || isActive) ? '#fff' : COLORS.textMuted,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 10, fontWeight: 800,
                  cursor: allowJump ? 'pointer' : 'default',
                  transition: 'all 0.2s',
                  border: isActive ? `3px solid ${COLORS.goldPale}` : 'none',
                  boxSizing: 'content-box'
                }}>
                  {isDone ? '✓' : step}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WizardNavigation({ currentStep, totalSteps, onPrevious, onNext, onSkip, onSaveDraft, nextLabel = 'Selanjutnya', allowSkip = true }) {
      return (
        <div className="no-print" style={{
          position: 'sticky', bottom: 0, background: COLORS.white,
          borderTop: `1px solid ${COLORS.borderLight}`,
          padding: '12px 16px',
          boxShadow: '0 -4px 16px rgba(0,0,0,0.05)',
          zIndex: 10
        }}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
            {currentStep > 1 && (
              <button onClick={onPrevious} className="gfl-btn gfl-btn-secondary" style={{ flex: 1 }}>
                <Icon name="arrowLeft" size={14} /> Sebelumnya
              </button>
            )}
            <button onClick={onNext} className="gfl-btn gfl-btn-primary" style={{ flex: currentStep > 1 ? 1.5 : 1 }}>
              {nextLabel} <Icon name="arrowRight" size={14} color="#fff" />
            </button>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <button onClick={onSaveDraft} style={{
              background: 'none', border: 'none', cursor: 'pointer',
              fontSize: 11, color: COLORS.textMuted, fontWeight: 600,
              display: 'flex', alignItems: 'center', gap: 4, padding: 4
            }}>
              <Icon name="bookmark" size={12} /> Simpan Draft
            </button>
            {allowSkip && currentStep < totalSteps && (
              <button onClick={onSkip} style={{
                background: 'none', border: 'none', cursor: 'pointer',
                fontSize: 11, color: COLORS.textMuted, fontWeight: 600, padding: 4
              }}>
                Lewati →
              </button>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // DRAFT SELECTION MODAL - shown when user has saved drafts
    // ============================================================
    function DraftSelectionModal({ drafts, onLoadDraft, onNewReport, onDeleteDraft, onClose }) {

                    Lanjutkan
                  </button>
                  <button onClick={() => onDeleteDraft(d.id)} style={{

    // ============================================================
    // SUBMIT SUCCESS MODAL - dengan pilihan download
    // ============================================================
    function SubmitSuccessModal({ report, onClose, onDownloadPDF, onDownloadJPEG, onViewReport, onNewReport }) {
      return (
        <Modal open={true} onClose={() => {}} title="" maxWidth={360}>
          <div style={{ textAlign: 'center', padding: '8px 0 0' }}>

              width: 72, height: 72, borderRadius: '50%',
              background: `linear-gradient(135deg, ${COLORS.success}, #2ECC71)`,

            }}>

            </button>
            <button onClick={onNewReport} style={{
              background: 'none', border: 'none', color: COLORS.textMuted,

    }
    // ============================================================
    // INPUT LAPORAN WIZARD - Main Component
    // ============================================================
    function InputLaporanWizard({ currentUser, onNavigate, data, setData, showToast, initialDraft }) {
      const [showDraftModal, setShowDraftModal] = React.useState(false);
      const [showSuccess, setShowSuccess] = React.useState(null);

      // Check for existing drafts on first render
      React.useEffect(() => {
        if (!initialDraft) {
          const myDrafts = (data.drafts || []).filter(d => d.leaderId === currentUser.id);
          if (myDrafts.length > 0) setShowDraftModal(true);
        }
      }, []);

      // Wizard state
      const [step, setStep] = React.useState(1);
      const [draftId, setDraftId] = React.useState(initialDraft?.id || null);

      // Step 1: Info Dasar
      const [tanggal, setTanggal] = React.useState(initialDraft?.date || new Date().toISOString().split('T')[0]);
      const [shift, setShift] = React.useState(initialDraft?.shift || 1);
      const [mixingActive, setMixingActive] = React.useState(initialDraft?.mixingActive ?? true);
      const [dryingActive, setDryingActive] = React.useState(initialDraft?.dryingActive ?? true);

      // Step 2: Mixing + Bahan Baku
      const [mixing, setMixing] = React.useState(initialDraft?.mixing || [
        { id: 1, machineName: '', productName: '', plannings: [{ id: 1, noPlanning: '', batches: 0 }] }
      ]);
      const [flour, setFlour] = React.useState(initialDraft?.flour || [{ id: 1, brand: '', amount: 0, unit: 'sak' }]);
      const [ragi, setRagi] = React.useState(initialDraft?.ragi || 0);

      // Step 3: Drying + Gas
      const [drying, setDrying] = React.useState(initialDraft?.drying || [
        { id: 1, machineNo: '', productName: '', plannings: [{ id: 1, noPlanning: '', sacks: 0 }] }
      ]);
      const [meterStart, setMeterStart] = React.useState(initialDraft?.gas?.meterStart || 0);
      const [meterEnd, setMeterEnd] = React.useState(initialDraft?.gas?.meterEnd || 0);
      const [gasNote, setGasNote] = React.useState(initialDraft?.gas?.note || '');

      // Step 4: Tenaga Kerja
      const [workforce, setWorkforce] = React.useState(initialDraft?.workforce || {
        mixing: [], baking: [], drying: [], indexing: [], note: ''
      });

      // Step 5: Downtime + Catatan Umum
      const [downtime, setDowntime] = React.useState(initialDraft?.downtime || []);
      const [generalNote, setGeneralNote] = React.useState(initialDraft?.generalNote || '');

      // Auto-fill meter start dari laporan terakhir
      React.useEffect(() => {
        if (!initialDraft && meterStart === 0) {
          const lastReport = [...data.reports].sort((a, b) =>
            new Date(b.submittedAt || b.date) - new Date(a.submittedAt || a.date))[0];
          if (lastReport) setMeterStart(lastReport.gas?.meterEnd || 0);
        }
      }, []);

      // Calculations
      const targetTepung = React.useMemo(() => {
        if (!mixingActive) return 0;
        let total = 0;
        mixing.forEach(m => {
          const totalBatch = (m.plannings || []).reduce((s, p) => s + (p.batches || 0), 0);
          if (m.machineName === 'Mixer Kecil') total += totalBatch * 1.4;
          else if (m.machineName === 'Mixer Besar') total += totalBatch * 6;
        });
        return Math.round(total * 100) / 100;
      }, [mixing, mixingActive]);

      const totalFlourInput = React.useMemo(() => flour.reduce((s, f) => s + (f.amount || 0), 0), [flour]);
      const flourDiff = totalFlourInput - targetTepung;
      const flourValid = Math.abs(flourDiff) <= 1;

      const gasSelisihM3 = Math.max(0, meterEnd - meterStart);
      const gasSm3 = gasSelisihM3 > 0 ? calcGasSm3(meterStart, meterEnd, data.gasConfig) : 0;
      const gasBiaya = gasSm3 * data.gasConfig.pricePerSm3;

      const productOptions = data.products.filter(p => p.active).map(p => p.name);
      const mixerOptions = data.machines.filter(m => m.active && m.category === 'Mixing').map(m => m.name);
      const dryerOptions = data.machines.filter(m => m.active && m.category === 'Drying').map(m => m.name);
      const flourOptions = data.flourBrands.filter(f => f.active).map(f => f.name);
      const employeeOptions = data.employees.filter(e => e.active).map(e => e.name);

      // === Mixing handlers
      function addMixing() { setMixing([...mixing, { id: Date.now(), machineName: '', productName: '', plannings: [{ id: Date.now(), noPlanning: '', batches: 0 }] }]); }
      function updateMixing(idx, field, val) { const n = [...mixing]; n[idx] = { ...n[idx], [field]: val }; setMixing(n); }
      function removeMixing(idx) { setMixing(mixing.filter((_, i) => i !== idx)); }
      function addMixingPlanning(idx) { const n = [...mixing]; n[idx].plannings = [...n[idx].plannings, { id: Date.now(), noPlanning: '', batches: 0 }]; setMixing(n); }
      function updateMixingPlanning(mI, pI, field, val) { const n = [...mixing]; n[mI].plannings = [...n[mI].plannings]; n[mI].plannings[pI] = { ...n[mI].plannings[pI], [field]: val }; setMixing(n); }
      function removeMixingPlanning(mI, pI) { const n = [...mixing]; n[mI].plannings = n[mI].plannings.filter((_, i) => i !== pI); setMixing(n); }

      // === Drying handlers
      function addDrying() { setDrying([...drying, { id: Date.now(), machineNo: '', productName: '', plannings: [{ id: Date.now(), noPlanning: '', sacks: 0 }] }]); }
      function updateDrying(idx, field, val) { const n = [...drying]; n[idx] = { ...n[idx], [field]: val }; setDrying(n); }
      function removeDrying(idx) { setDrying(drying.filter((_, i) => i !== idx)); }
      function addDryingPlanning(idx) { const n = [...drying]; n[idx].plannings = [...n[idx].plannings, { id: Date.now(), noPlanning: '', sacks: 0 }]; setDrying(n); }
      function updateDryingPlanning(dI, pI, field, val) { const n = [...drying]; n[dI].plannings = [...n[dI].plannings]; n[dI].plannings[pI] = { ...n[dI].plannings[pI], [field]: val }; setDrying(n); }
      function removeDryingPlanning(dI, pI) { const n = [...drying]; n[dI].plannings = n[dI].plannings.filter((_, i) => i !== pI); setDrying(n); }

      // === Flour
      function addFlour() { setFlour([...flour, { id: Date.now(), brand: '', amount: 0, unit: 'sak' }]); }
      function updateFlour(idx, field, val) { const n = [...flour]; n[idx] = { ...n[idx], [field]: val }; setFlour(n); }
      function removeFlour(idx) { setFlour(flour.filter((_, i) => i !== idx)); }

      // === Downtime
      function addDowntime() { setDowntime([...downtime, { id: Date.now(), machineName: '', startTime: '', endTime: '', duration: 0, category: '', detailMachine: '', detailReason: '' }]); }
      function updateDowntime(idx, field, val) {
        const n = [...downtime];
        n[idx] = { ...n[idx], [field]: val };
        if (field === 'startTime' || field === 'endTime') {
          const s = n[idx].startTime, e = n[idx].endTime;
          if (s && e) {
            const [sh, sm] = s.split(':').map(Number);
            const [eh, em] = e.split(':').map(Number);
            let dur = (eh * 60 + em) - (sh * 60 + sm);
            if (dur < 0) dur += 24 * 60;
            n[idx].duration = dur;
          }
        }
        setDowntime(n);
      }
      function removeDowntime(idx) { setDowntime(downtime.filter((_, i) => i !== idx)); }

      // === Build report object
      function buildReport() {
        return {
          date: tanggal, shift, leaderId: currentUser.id, leaderName: currentUser.name,
          generalNote, mixingActive, dryingActive,
          mixing: mixingActive ? mixing : [],
          flour: mixingActive ? flour : [],
          ragi: mixingActive ? ragi : 0,
          drying: dryingActive ? drying : [],
          workforce, downtime,
          gas: { meterStart, meterEnd, sm3: gasSm3, biaya: gasBiaya, note: gasNote }
        };
      }

      // === Save Draft
      function handleSaveDraft() {
        const draftData = {
          ...buildReport(),
          id: draftId || Date.now(),
          currentStep: step,
          savedAt: new Date().toISOString(),
          isDraft: true
        };
        let newDrafts = data.drafts || [];
        if (draftId) {
          newDrafts = newDrafts.map(d => d.id === draftId ? draftData : d);
        } else {
          newDrafts = [...newDrafts, draftData];
          setDraftId(draftData.id);
        }
        setData({ ...data, drafts: newDrafts });
        showToast('Draft tersimpan', 'success');
      }

      // Auto-save draft on step change
      function autoSaveDraft(currentStepNum) {
        const draftData = {
          ...buildReport(),
          id: draftId || Date.now(),
          currentStep: currentStepNum,
          savedAt: new Date().toISOString(),
          isDraft: true
        };
        let newDrafts = data.drafts || [];
        if (draftId) {
          newDrafts = newDrafts.map(d => d.id === draftId ? draftData : d);
        } else {
          newDrafts = [...newDrafts, draftData];
          setDraftId(draftData.id);
        }
        setData({ ...data, drafts: newDrafts });
      }

      // === Step navigation
      function goNext() {
        if (step < 6) {
          autoSaveDraft(step + 1);
          setStep(step + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          handleSubmit();
        }
      }
      function goPrevious() {
        if (step > 1) {
          autoSaveDraft(step - 1);
          setStep(step - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
      function goSkip() {
        if (step < 6) {
          setStep(step + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
      function jumpToStep(s) {
        autoSaveDraft(s);
        setStep(s);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // === Submit final
      function handleSubmit() {
        if (!mixingActive && !dryingActive) {
          showToast('Tidak boleh kedua bagian non-aktif', 'error');
          return;
        }
        if (mixingActive && !flourValid) {
          showToast(`Total tepung tidak sesuai (selisih ${flourDiff.toFixed(2)} sak, max ±1)`, 'error');
          setStep(2);
          return;
        }
        if (dryingActive && meterEnd < meterStart) {
          showToast('Meter akhir tidak boleh < meter awal', 'error');
          setStep(3);
          return;
        }

        const newReport = {
          ...buildReport(),
          id: Date.now(),
          status: 'final',
          submittedAt: new Date().toISOString(),
        };

        // Remove draft if exists
        let newDrafts = data.drafts || [];
        if (draftId) newDrafts = newDrafts.filter(d => d.id !== draftId);

        const newData = {
          ...data,
          reports: [...data.reports, newReport],
          drafts: newDrafts,
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'create_report',
            target: `Laporan ${formatDate(tanggal)} Shift ${shift}`,
            details: `Total batch: ${(newReport.mixing || []).reduce((s,m) => s + m.plannings.reduce((sp,p)=>sp+p.batches,0), 0)}`
          }]
        };
        setData(newData);
        setShowSuccess(newReport);
      }

      const downtimeCategories = ['Kerusakan Listrik', 'Kerusakan Mesin', 'Maintenance Terjadwal', 'Pergantian Produk', 'Cleaning Produk', 'Lainnya'];

      // ===== Render Wizard Steps =====
      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream, paddingBottom: 0 }}>
          <PageHeader
            title="Buat Laporan Produksi"
            subtitle={shiftLabel(shift)}
            onBack={() => onNavigate('dashboard')}
            dark={true}
          />

          <WizardStepper currentStep={step} totalSteps={6} onStepClick={jumpToStep} />

          <div style={{ padding: '14px 14px 100px' }}>
            {step === 1 && (
              <Step1InfoDasar
                tanggal={tanggal} setTanggal={setTanggal}
                shift={shift} setShift={setShift}
                mixingActive={mixingActive} setMixingActive={setMixingActive}
                dryingActive={dryingActive} setDryingActive={setDryingActive}
                currentUser={currentUser}
              />
            )}
            {step === 2 && (
              <Step2MixingTepung
                mixingActive={mixingActive}
                mixing={mixing} addMixing={addMixing} updateMixing={updateMixing} removeMixing={removeMixing}
                addMixingPlanning={addMixingPlanning} updateMixingPlanning={updateMixingPlanning} removeMixingPlanning={removeMixingPlanning}
                flour={flour} addFlour={addFlour} updateFlour={updateFlour} removeFlour={removeFlour}
                ragi={ragi} setRagi={setRagi}
                productOptions={productOptions} mixerOptions={mixerOptions} flourOptions={flourOptions}
                targetTepung={targetTepung} totalFlourInput={totalFlourInput} flourDiff={flourDiff} flourValid={flourValid}
              />
            )}
            {step === 3 && (
              <Step3DryingGas
                dryingActive={dryingActive}
                drying={drying} addDrying={addDrying} updateDrying={updateDrying} removeDrying={removeDrying}
                addDryingPlanning={addDryingPlanning} updateDryingPlanning={updateDryingPlanning} removeDryingPlanning={removeDryingPlanning}
                productOptions={productOptions} dryerOptions={dryerOptions}
                meterStart={meterStart} meterEnd={meterEnd} setMeterEnd={setMeterEnd}
                gasNote={gasNote} setGasNote={setGasNote}
                gasSelisihM3={gasSelisihM3} gasSm3={gasSm3} gasBiaya={gasBiaya}
              />
            )}
            {step === 4 && (
              <Step4Workforce workforce={workforce} setWorkforce={setWorkforce} employeeOptions={employeeOptions} />
            )}
            {step === 5 && (
              <Step5Downtime
                downtime={downtime} addDowntime={addDowntime} updateDowntime={updateDowntime} removeDowntime={removeDowntime}
                downtimeCategories={downtimeCategories}
                mixerOptions={mixerOptions} dryerOptions={dryerOptions}
                generalNote={generalNote} setGeneralNote={setGeneralNote}
              />
            )}
            {step === 6 && (
              <Step6Review
                report={buildReport()} currentUser={currentUser} onJumpToStep={jumpToStep}
              />
            )}
          </div>

          <WizardNavigation
            currentStep={step} totalSteps={6}
            onPrevious={goPrevious} onNext={goNext} onSkip={goSkip}
            onSaveDraft={handleSaveDraft}
            nextLabel={step === 6 ? 'Submit Laporan ✓' : 'Selanjutnya'}
            allowSkip={step !== 6}
          />

          {showDraftModal && (
            <DraftSelectionModal
              drafts={(data.drafts || []).filter(d => d.leaderId === currentUser.id)}
              onLoadDraft={(d) => {
                // Reload page with draft
                onNavigate('input-laporan', { draft: d });
                setShowDraftModal(false);
              }}
              onNewReport={() => setShowDraftModal(false)}
              onDeleteDraft={(id) => {

                      <tr style={{ background: COLORS.goldPale, fontWeight: 800 }}>

    const cellStyle = { padding: '6px 8px', textAlign: 'left', borderBottom: `1px solid ${COLORS.borderLight}`, fontSize: 11 };
    const cellStyleR = { ...cellStyle, textAlign: 'right' };

    function ReviewSection({ title, editStep, onEdit, children }) {

        <div style={{ marginBottom: 14 }}>
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',

    // ============================================================
    // MONITORING PAGE
    // ============================================================
    function MonitoringPage({ currentUser, onNavigate, data, setData, showToast }) {
      const [search, setSearch] = React.useState('');
      const [filterShift, setFilterShift] = React.useState('all');
      const [filterDateFrom, setFilterDateFrom] = React.useState('');
      const [filterDateTo, setFilterDateTo] = React.useState('');
      const [showFilter, setShowFilter] = React.useState(false);
      const [deleteTarget, setDeleteTarget] = React.useState(null);

      const filtered = React.useMemo(() => {
        return data.reports.filter(r => {
          if (filterShift !== 'all' && r.shift !== parseInt(filterShift)) return false;
          if (filterDateFrom && r.date < filterDateFrom) return false;
          if (filterDateTo && r.date > filterDateTo) return false;
          if (search) {
            const q = search.toLowerCase();
            return r.leaderName.toLowerCase().includes(q) || r.date.includes(q) || ('shift ' + r.shift).includes(q);
          }
          return true;
        }).sort((a, b) => new Date(b.submittedAt || b.date) - new Date(a.submittedAt || a.date));
      }, [data.reports, search, filterShift, filterDateFrom, filterDateTo]);

      function handleDelete(report, password) {
        if (password !== currentUser.password) {
          showToast('Password salah', 'error');
          return false;
        }
        const newData = {
          ...data,
          reports: data.reports.filter(r => r.id !== report.id),
          deletedReports: [...(data.deletedReports || []), { ...report, deletedAt: new Date().toISOString(), deletedBy: currentUser.name }],
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: 'delete_report', target: `Laporan ${formatDate(report.date)} Shift ${report.shift}`,
            details: 'Soft delete'
          }]
        };
        setData(newData);
        showToast('Laporan dihapus', 'success');
        setDeleteTarget(null);
        return true;
      }

      return (
        <div style={{ paddingBottom: 80 }}>
          <PageHeader title="Monitoring Laporan" subtitle={`${filtered.length} laporan`} dark={true} action={
            <button onClick={() => setShowFilter(!showFilter)} style={{
              background: showFilter ? COLORS.gold : 'rgba(255,255,255,0.1)', border: 'none',
              borderRadius: 12, padding: 10, cursor: 'pointer'
            }}>
              <Icon name="filter" size={16} color="#fff" />
            </button>
          } />

          <div style={{ padding: 14 }}>
            <div style={{ position: 'relative', marginBottom: 12 }}>
              <Icon name="search" size={16} color={COLORS.textMuted} />
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Cari laporan..." className="gfl-input" style={{ paddingLeft: 38 }} />
              <div style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)' }}>
                <Icon name="search" size={16} color={COLORS.textMuted} />
              </div>
            </div>

            {showFilter && (
              <div className="gfl-card gfl-fade-in" style={{ marginBottom: 12, padding: 14 }}>
                <div style={{ marginBottom: 10 }}>
                  <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Shift</label>
                  <select value={filterShift} onChange={e => setFilterShift(e.target.value)} className="gfl-input">
                    <option value="all">Semua Shift</option>
                    <option value="1">Shift 1</option>
                    <option value="2">Shift 2</option>
                    <option value="3">Shift 3</option>
                  </select>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Dari</label>
                    <input type="date" value={filterDateFrom} onChange={e => setFilterDateFrom(e.target.value)} className="gfl-input" />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Sampai</label>
                    <input type="date" value={filterDateTo} onChange={e => setFilterDateTo(e.target.value)} className="gfl-input" />
                  </div>
                </div>
                {(filterShift !== 'all' || filterDateFrom || filterDateTo) && (
                  <button onClick={() => { setFilterShift('all'); setFilterDateFrom(''); setFilterDateTo(''); }} className="gfl-btn gfl-btn-ghost" style={{ marginTop: 10, width: '100%' }}>
                    Reset Filter
                  </button>
                )}
              </div>
            )}

            {filtered.length === 0 ? (
              <EmptyState icon="info" title="Belum ada laporan" message="Coba ubah filter atau buat laporan baru" />
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {filtered.map(r => (
                  <div key={r.id} className="gfl-card gfl-card-hover" style={{ padding: 14, position: 'relative' }}>
                    <div onClick={() => onNavigate('laporan-detail', { report: r })} style={{ cursor: 'pointer' }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 6 }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.brown }}>{formatDate(r.date)}</div>
                          <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 2 }}>
                            Shift {r.shift} · {r.leaderName}
                          </div>
                        </div>
                        <Badge color={COLORS.success}>Final</Badge>
                      </div>
                      <div style={{ display: 'flex', gap: 12, fontSize: 11, color: COLORS.textMuted }}>
                        <span>📦 {calcReportTotals(r).totalBatch} btc</span>
                        <span>🔥 {calcReportTotals(r).totalSak} sak</span>
                        <span>⛽ {formatNumber(r.gas?.sm3 || 0, 1)} Sm³</span>
                      </div>
                    </div>
                    {currentUser.role === 'Admin' && (
                      <button onClick={() => setDeleteTarget(r)} style={{
                        position: 'absolute', top: 8, right: 8,
                        background: COLORS.dangerLight, border: 'none', borderRadius: 999,
                        padding: 6, cursor: 'pointer', color: COLORS.danger
                      }}>
                        <Icon name="trash" size={12} />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>

          {deleteTarget && (
            <DeleteReportModal
              report={deleteTarget}
              onClose={() => setDeleteTarget(null)}
              onConfirm={(pwd) => handleDelete(deleteTarget, pwd)}
            />
          )}
        </div>
      );
    }

    function DeleteReportModal({ report, onClose, onConfirm }) {
      const [pwd, setPwd] = React.useState('');
      return (
        <Modal open={true} onClose={onClose} title="🗑️ Hapus Laporan">
          <div style={{
            padding: 14, background: COLORS.dangerLight, borderRadius: 12, marginBottom: 14
          }}>
            <div style={{ fontSize: 12, color: COLORS.danger, fontWeight: 700, marginBottom: 4 }}>⚠️ Konfirmasi</div>
            <div style={{ fontSize: 11, color: COLORS.text }}>
              Anda akan menghapus laporan <strong>{formatDate(report.date)} Shift {report.shift}</strong>.
              Laporan akan masuk arsip dan dapat dipulihkan oleh admin.
            </div>
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>
              Password Admin Anda
            </label>
            <input type="password" value={pwd} onChange={e => setPwd(e.target.value)} className="gfl-input" placeholder="••••••••" />

        try {

          let qrDataUrl = '';

            qrDataUrl = await QRCode.toDataURL(qrData, { width: 120, margin: 1 });

          // Create vertical 1080x1920 canvas
          const targetCanvas = document.createElement('canvas');
          targetCanvas.width = 1080;
          targetCanvas.height = 1920;
          const ctx = targetCanvas.getContext('2d');

          // Background gradient
          const grad = ctx.createLinearGradient(0, 0, 0, 1920);
          grad.addColorStop(0, '#2A1807');
          grad.addColorStop(0.18, '#3D2210');
          grad.addColorStop(0.18, '#F5EFE2');

          ctx.fillStyle = '#fff';
          ctx.fillRect(50, 360, targetW, Math.min(targetH, 1300));

    // ============================================================
    // MUTASI LAPORAN PAGE - dengan Export Excel multi-sheet + PDF
    // ============================================================
    function MutasiLaporanPage({ currentUser, onNavigate, data, showToast, pageParams }) {
      const today = new Date();
      const lastMonth = new Date(); lastMonth.setMonth(lastMonth.getMonth() - 1);
      const [dateFrom, setDateFrom] = React.useState(lastMonth.toISOString().split('T')[0]);
      const [dateTo, setDateTo] = React.useState(today.toISOString().split('T')[0]);
      const [filterShift, setFilterShift] = React.useState('all');
      const [filterLeader, setFilterLeader] = React.useState('all');

      const filtered = React.useMemo(() => {
        return data.reports.filter(r => {
          if (r.date < dateFrom || r.date > dateTo) return false;
          if (filterShift !== 'all' && r.shift !== parseInt(filterShift)) return false;
          if (filterLeader !== 'all' && r.leaderId !== parseInt(filterLeader)) return false;
          return true;
        }).sort((a, b) => a.date.localeCompare(b.date) || a.shift - b.shift);
      }, [data.reports, dateFrom, dateTo, filterShift, filterLeader]);

      // Aggregations
      const stats = React.useMemo(() => {
        let totalBatch = 0, totalSak = 0, totalGasSm3 = 0, totalGasBiaya = 0, totalDowntime = 0, totalTepung = 0, totalRagi = 0;
        const perLeader = {};
        filtered.forEach(r => {
          const tb = (r.mixing || []).reduce((s, m) => s + (m.plannings || []).reduce((sp, p) => sp + (p.batches || 0), 0), 0);
          const ts = (r.drying || []).reduce((s, d) => s + (d.plannings || []).reduce((sp, p) => sp + (p.sacks || 0), 0), 0);
          const td = (r.downtime || []).reduce((s, dt) => s + (dt.duration || 0), 0);
          const tt = (r.flour || []).reduce((s, f) => s + (f.amount || 0), 0);
          totalBatch += tb; totalSak += ts; totalGasSm3 += (r.gas?.sm3 || 0); totalGasBiaya += (r.gas?.biaya || 0); totalDowntime += td; totalTepung += tt; totalRagi += (r.ragi || 0);
          if (!perLeader[r.leaderName]) perLeader[r.leaderName] = { reports: 0, batch: 0, sak: 0, gasSm3: 0, gasBiaya: 0, downtime: 0, tepung: 0 };
          perLeader[r.leaderName].reports++;
          perLeader[r.leaderName].batch += tb;
          perLeader[r.leaderName].sak += ts;
          perLeader[r.leaderName].gasSm3 += (r.gas?.sm3 || 0);
          perLeader[r.leaderName].gasBiaya += (r.gas?.biaya || 0);
          perLeader[r.leaderName].downtime += td;
          perLeader[r.leaderName].tepung += tt;
        });
        return { totalBatch, totalSak, totalGasSm3, totalGasBiaya, totalDowntime, totalTepung, totalRagi, perLeader };
      }, [filtered]);

      // ===== Excel Export Multi-Sheet =====
      function exportExcel() {
        if (filtered.length === 0) {
          showToast('Tidak ada data untuk diekspor', 'error');
          return;
        }
        try {
          const wb = XLSX.utils.book_new();

          // Sheet 1: RINGKASAN
          const ringkasan = [
            ['CV GOLDEN FOOD LESTARI'],
            ['LAPORAN MUTASI PRODUKSI'],
            [`Periode: ${formatDate(dateFrom)} s/d ${formatDate(dateTo)}`],
            [],
            ['Tanggal', 'Shift', 'Leader', 'Total Batch', 'Total Sak', 'Tepung (sak)', 'Ragi (kg)', 'Gas (Sm³)', 'Biaya Gas (Rp)', 'Downtime (mnt)'],
          ];
          filtered.forEach(r => {
            const tb = (r.mixing || []).reduce((s, m) => s + (m.plannings || []).reduce((sp, p) => sp + (p.batches || 0), 0), 0);
            const ts = (r.drying || []).reduce((s, d) => s + (d.plannings || []).reduce((sp, p) => sp + (p.sacks || 0), 0), 0);
            const td = (r.downtime || []).reduce((s, dt) => s + (dt.duration || 0), 0);
            const tt = (r.flour || []).reduce((s, f) => s + (f.amount || 0), 0);
            ringkasan.push([
              r.date, `Shift ${r.shift}`, r.leaderName, tb, ts, tt, r.ragi || 0,
              Math.round((r.gas?.sm3 || 0) * 100) / 100,
              Math.round(r.gas?.biaya || 0), td
            ]);
          });
          ringkasan.push([]);
          ringkasan.push(['TOTAL', '', '', stats.totalBatch, stats.totalSak, stats.totalTepung, stats.totalRagi, Math.round(stats.totalGasSm3 * 100) / 100, Math.round(stats.totalGasBiaya), stats.totalDowntime]);
          const ws1 = XLSX.utils.aoa_to_sheet(ringkasan);
          ws1['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 20 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 16 }, { wch: 14 }];
          XLSX.utils.book_append_sheet(wb, ws1, 'Ringkasan');

          // Sheet 2: RINCIAN MIXING
          const rincianMixing = [
            ['RINCIAN MIXING'],
            [`Periode: ${formatDate(dateFrom)} s/d ${formatDate(dateTo)}`],
            [],
            ['Tanggal', 'Shift', 'Leader', 'Mesin', 'Produk', 'No. Planning', 'Batch'],
          ];
          filtered.forEach(r => {
            (r.mixing || []).forEach(m => (m.plannings || []).forEach(p => {
              rincianMixing.push([r.date, `Shift ${r.shift}`, r.leaderName, m.machineName, m.productName, p.noPlanning, p.batches]);
            }));
          });
          rincianMixing.push([]);
          rincianMixing.push(['', '', '', '', '', 'TOTAL BATCH', stats.totalBatch]);
          const ws2 = XLSX.utils.aoa_to_sheet(rincianMixing);
          ws2['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 20 }, { wch: 14 }, { wch: 22 }, { wch: 14 }, { wch: 10 }];
          XLSX.utils.book_append_sheet(wb, ws2, 'Rincian Mixing');

          // Sheet 3: RINCIAN DRYING
          const rincianDrying = [
            ['RINCIAN DRYING'],
            [`Periode: ${formatDate(dateFrom)} s/d ${formatDate(dateTo)}`],
            [],
            ['Tanggal', 'Shift', 'Leader', 'Mesin', 'Produk', 'No. Planning', 'Sak'],
          ];
          filtered.forEach(r => {
            (r.drying || []).forEach(d => (d.plannings || []).forEach(p => {
              rincianDrying.push([r.date, `Shift ${r.shift}`, r.leaderName, d.machineNo, d.productName, p.noPlanning, p.sacks]);
            }));
          });
          rincianDrying.push([]);
          rincianDrying.push(['', '', '', '', '', 'TOTAL SAK', stats.totalSak]);
          const ws3 = XLSX.utils.aoa_to_sheet(rincianDrying);
          ws3['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 20 }, { wch: 14 }, { wch: 22 }, { wch: 14 }, { wch: 10 }];
          XLSX.utils.book_append_sheet(wb, ws3, 'Rincian Drying');

          // Sheet 4: TOTAL PER LEADER
          const perLeader = [
            ['TOTAL PER LEADER'],
            [`Periode: ${formatDate(dateFrom)} s/d ${formatDate(dateTo)}`],
            [],
            ['Leader', 'Jumlah Laporan', 'Total Batch', 'Total Sak', 'Tepung (sak)', 'Gas (Sm³)', 'Biaya Gas (Rp)', 'Downtime (mnt)'],
          ];
          Object.entries(stats.perLeader).forEach(([name, s]) => {
            perLeader.push([name, s.reports, s.batch, s.sak, s.tepung, Math.round(s.gasSm3 * 100) / 100, Math.round(s.gasBiaya), s.downtime]);
          });
          perLeader.push([]);
          perLeader.push(['TOTAL KESELURUHAN', filtered.length, stats.totalBatch, stats.totalSak, stats.totalTepung, Math.round(stats.totalGasSm3 * 100) / 100, Math.round(stats.totalGasBiaya), stats.totalDowntime]);
          const ws4 = XLSX.utils.aoa_to_sheet(perLeader);
          ws4['!cols'] = [{ wch: 22 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 16 }, { wch: 14 }];
          XLSX.utils.book_append_sheet(wb, ws4, 'Total per Leader');

          XLSX.writeFile(wb, `Mutasi_Produksi_GFL_${dateFrom}_${dateTo}.xlsx`);
          showToast('Excel berhasil diunduh', 'success');
        } catch (e) {
          console.error(e);
          showToast('Gagal membuat Excel', 'error');
        }
      }

      function exportPDF() {
        showToast('Membuka dialog print...', 'info');

    function UsersManagement({ data, setData, currentUser, showToast }) {
      const [editing, setEditing] = React.useState(null);
      const [showAdd, setShowAdd] = React.useState(false);

      function handleSave(user) {
        let newUsers, action;
        if (user.id) {
          newUsers = data.users.map(u => u.id === user.id ? user : u);
          action = 'edit_user';
        } else {
          user.id = Date.now();
          newUsers = [...data.users, user];
          action = 'add_user';
        }
        setData({
          ...data,
          users: newUsers,
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action, target: user.name, details: ''
          }]
        });
        setEditing(null); setShowAdd(false);
        showToast('User tersimpan', 'success');
      }

      function handleToggle(user) {
        const newUsers = data.users.map(u => u.id === user.id ? { ...u, active: !u.active } : u);
        setData({
          ...data, users: newUsers,
          activityLog: [...(data.activityLog || []), {
            id: Date.now(), timestamp: new Date().toISOString(),
            userId: currentUser.id, userName: currentUser.name,
            action: user.active ? 'deactivate_user' : 'activate_user',
            target: user.name, details: ''
          }]
        });
        showToast(`User ${user.active ? 'dinonaktifkan' : 'diaktifkan'}`, 'success');
      }

      return (
        <div>
          <button onClick={() => setShowAdd(true)} className="gfl-btn gfl-btn-primary" style={{ width: '100%', marginBottom: 12 }}>
            <Icon name="plus" size={14} color="#fff" /> Tambah User
          </button>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {data.users.map(u => (
              <div key={u.id} className="gfl-card" style={{ padding: 12, opacity: u.active ? 1 : 0.6 }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.brown }}>{u.name}</div>
                    <div style={{ fontSize: 11, color: COLORS.textMuted }}>{u.email}</div>
                    <div style={{ marginTop: 4 }}><Badge color={COLORS.gold}>{u.role}</Badge></div>
                  </div>
                  <div style={{ display: 'flex', gap: 4 }}>
                    <button onClick={() => setEditing(u)} style={{
                      background: COLORS.goldPale, border: 'none', borderRadius: 999,
                      padding: 6, cursor: 'pointer'
                    }}><Icon name="edit" size={12} color={COLORS.gold} /></button>
                    {u.id !== currentUser.id && (
                      <button onClick={() => handleToggle(u)} style={{
                        background: u.active ? COLORS.dangerLight : COLORS.successLight,
                        border: 'none', borderRadius: 999, padding: 6, cursor: 'pointer'
                      }}>
                        <Icon name={u.active ? 'eyeOff' : 'eye'} size={12} color={u.active ? COLORS.danger : COLORS.success} />
                      </button>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
          {(editing || showAdd) && (
            <UserFormModal
              user={editing || { name: '', email: '', password: '', role: 'Team Leader', phone: '', joinDate: new Date().toISOString().split('T')[0], active: true }}
              onSave={handleSave}
              onClose={() => { setEditing(null); setShowAdd(false); }}
            />
          )}
        </div>
      );
    }

          ))}
        </div>
      );
    }

    // ============================================================
    // PROFILE PAGE
    // ============================================================
    function ProfilePage({ currentUser, onLogout, onNavigate, data, setData, showToast }) {
      const [editing, setEditing] = React.useState(false);
      const [form, setForm] = React.useState({ ...currentUser });

      function handleSave() {
        const newUsers = data.users.map(u => u.id === currentUser.id ? { ...u, ...form } : u);
        setData({ ...data, users: newUsers });
        setEditing(false);
        showToast('Profil tersimpan', 'success');
      }

      return (
        <div style={{ paddingBottom: 80 }}>
          <PageHeader title="Profil Saya" onBack={() => onNavigate('dashboard')} dark={true} />

          <div style={{ padding: 14 }}>
            <div className="gfl-card" style={{ marginBottom: 12, padding: 18 }}>
              <div style={{ textAlign: 'center', marginBottom: 16 }}>
                <div style={{
                  width: 72, height: 72, borderRadius: '50%',
                  background: `linear-gradient(135deg, ${COLORS.gold}, ${COLORS.goldLight})`,
                  margin: '0 auto 10px',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 28, fontWeight: 800, color: '#fff',
                  boxShadow: '0 8px 24px rgba(184,134,11,0.3)'
                }}>
                  {currentUser.name.charAt(0)}
                </div>
                <h2 style={{ fontSize: 16, fontWeight: 800, color: COLORS.brown, letterSpacing: -0.3 }}>{currentUser.name}</h2>
                <Badge color={COLORS.gold}>{currentUser.role}</Badge>
              </div>

              {editing ? (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Nama</label>
                    <StableTextInput value={form.name} onChange={v => setForm({ ...form, name: v })} />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>HP</label>
                    <StableTextInput value={form.phone} onChange={v => setForm({ ...form, phone: v })} />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: COLORS.brown, marginBottom: 4, display: 'block', textTransform: 'uppercase' }}>Password Baru</label>
                    <StableTextInput value={form.password} onChange={v => setForm({ ...form, password: v })} placeholder="Password" />
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => { setEditing(false); setForm({ ...currentUser }); }} className="gfl-btn gfl-btn-secondary" style={{ flex: 1 }}>Batal</button>
                    <button onClick={handleSave} className="gfl-btn gfl-btn-primary" style={{ flex: 1 }}>Simpan</button>
                  </div>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <InfoRow label="Email" value={currentUser.email} />
                  <InfoRow label="HP" value={currentUser.phone} />
                  <InfoRow label="Bergabung" value={formatDateShort(currentUser.joinDate)} />
                  <button onClick={() => setEditing(true)} className="gfl-btn gfl-btn-secondary" style={{ marginTop: 6 }}>
                    <Icon name="edit" size={14} /> Edit Profil
                  </button>
                </div>
              )}
            </div>

            <button onClick={onLogout} className="gfl-btn gfl-btn-danger" style={{ width: '100%' }}>
              <Icon name="logout" size={14} color="#fff" /> Keluar
            </button>
          </div>
        </div>
      );
    }

    function InfoRow({ label, value }) {
      return (
        <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: `1px solid ${COLORS.borderLight}`, fontSize: 12 }}>
          <span style={{ color: COLORS.textMuted }}>{label}</span>
          <strong style={{ color: COLORS.brown, textAlign: 'right' }}>{value || '-'}</strong>
        </div>
      );
    }
    // ============================================================
    // MAIN APP - Router + Bottom Nav
    // ============================================================
    function App() {
      const [data, setData] = React.useState(loadData);
      const [currentUser, setCurrentUser] = React.useState(null);
      const [page, setPage] = React.useState('dashboard');
      const [pageParams, setPageParams] = React.useState({});
      const [pageHistory, setPageHistory] = React.useState([]);
      const [toast, setToast] = React.useState(null);

      // Auto-save data to localStorage
      React.useEffect(() => { saveData(data); }, [data]);

      function showToast(msg, type = 'info') {
        setToast({ msg, type, key: Date.now() });
      }

      function navigate(newPage, params = {}) {
        setPageHistory([...pageHistory, { page, params: pageParams }]);
        setPage(newPage);
        setPageParams(params);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function goBack() {
        if (pageHistory.length > 0) {
          const prev = pageHistory[pageHistory.length - 1];
          setPage(prev.page);
          setPageParams(prev.params);
          setPageHistory(pageHistory.slice(0, -1));
        } else {
          setPage('dashboard');
          setPageParams({});
        }
      }

      function handleLogin(user) {
        setCurrentUser(user);
        setPage('dashboard');
        showToast(`Selamat datang, ${user.name}`, 'success');
      }

      function handleLogout() {
        setCurrentUser(null);
        setPage('dashboard');
        setPageHistory([]);
      }

      // Not logged in
      if (!currentUser) return <LoginPage onLogin={handleLogin} data={data} />;

      // Bottom nav items based on role
      const navItems = [
        { id: 'dashboard', label: 'Beranda', icon: 'home' },
        { id: 'monitoring', label: 'Monitor', icon: 'list' },
        ...(currentUser.role !== 'Viewer' ? [{ id: 'input-laporan', label: 'Input', icon: 'plus', primary: true }] : []),
        { id: 'mutasi-laporan', label: 'Mutasi', icon: 'chart' },
        ...(currentUser.role === 'Admin' ? [{ id: 'master-data', label: 'Master', icon: 'settings' }] : []),
        { id: 'profile', label: 'Profil', icon: 'user' },
      ];

      function renderPage() {
        switch (page) {
          case 'dashboard':
            return <TodayDashboard currentUser={currentUser} onNavigate={navigate} data={data} />;
          case 'monitoring':
            return <MonitoringPage currentUser={currentUser} onNavigate={navigate} data={data} setData={setData} showToast={showToast} />;
          case 'input-laporan':
            return <InputLaporanWizard
              currentUser={currentUser}
              onNavigate={navigate}
              data={data}
              setData={setData}
              showToast={showToast}
              initialDraft={pageParams.draft}
            />;
          case 'laporan-detail':
            return <LaporanDetailPage
              report={pageParams.report}
              currentUser={currentUser}
              onNavigate={navigate}
              data={data}
              autoPrint={pageParams.autoPrint}
              autoJpeg={pageParams.autoJpeg}
              showToast={showToast}
            />;
          case 'mutasi-laporan':
            return <MutasiLaporanPage
              currentUser={currentUser}
              onNavigate={navigate}
              data={data}
              showToast={showToast}
              pageParams={pageParams}
            />;
          case 'master-data':
            return <MasterDataPage currentUser={currentUser} onNavigate={navigate} data={data} setData={setData} showToast={showToast} />;
          case 'profile':
            return <ProfilePage currentUser={currentUser} onLogout={handleLogout} onNavigate={navigate} data={data} setData={setData} showToast={showToast} />;
          default:
            return <TodayDashboard currentUser={currentUser} onNavigate={navigate} data={data} />;
        }
      }

      const showBottomNav = !['input-laporan', 'laporan-detail'].includes(page);

      return (
        <div style={{ minHeight: '100vh', background: COLORS.cream }}>
          {renderPage()}

          {/* Bottom Navigation */}
          {showBottomNav && (
            <div className="no-print" style={{
              position: 'fixed', bottom: 0, left: 0, right: 0,
              background: COLORS.white,
              borderTop: `1px solid ${COLORS.borderLight}`,
              padding: '8px 6px 12px', zIndex: 100,
              boxShadow: '0 -4px 16px rgba(0,0,0,0.05)',
              maxWidth: 430, margin: '0 auto'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-around', alignItems: 'center' }}>
                {navItems.map(item => {
                  const isActive = page === item.id;
                  if (item.primary) {
                    return (
                      <button key={item.id} onClick={() => navigate(item.id)} style={{
                        background: `linear-gradient(135deg, ${COLORS.gold}, ${COLORS.goldLight})`,
                        border: 'none', cursor: 'pointer',
                        width: 52, height: 52, borderRadius: '50%',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        boxShadow: '0 6px 16px rgba(184,134,11,0.4)',
                        transform: 'translateY(-12px)'
                      }}>
                        <Icon name={item.icon} size={22} color="#fff" stroke={2.5} />
                      </button>
                    );
                  }
                  return (
                    <button key={item.id} onClick={() => navigate(item.id)} style={{
                      background: 'none', border: 'none', cursor: 'pointer',
                      padding: '6px 8px', borderRadius: 12,
                      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
                      flex: 1, maxWidth: 76
                    }}>
                      <Icon name={item.icon} size={18} color={isActive ? COLORS.gold : COLORS.textMuted} />
                      <span style={{
                        fontSize: 9, fontWeight: 700,
                        color: isActive ? COLORS.gold : COLORS.textMuted,
                        letterSpacing: 0.2
                      }}>
                        {item.label}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
